<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium</title>
<style>
  /* The hidden panel: a book spine peeking from the screen edge on the dock side. Dark leather with gold pixel trim and
     the pixel logo, 26 px wide; hovering slides it 8 px further out (the window is 34 px wide for that), a click opens
     the panel. Pixel art: hard colour steps, no smoothing, steps() motion. ?edge=left|right&accent=#hex&label=… */
  :root { --accent: #a87ffb; --w: 26px; --gold: #f4c535; --gold-dk: #a3791b; --ink: #120905; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #spine { position: absolute; top: 0; bottom: 0; right: 0; width: var(--w); cursor: pointer; box-sizing: border-box;
    image-rendering: pixelated;
    /* Leather, lit from the inner edge: hard stops read as pixel shading on a rounded spine. */
    background: linear-gradient(90deg, #1a0d07 0 2px, #6b3c22 2px 4px, #57311c 4px 9px, #4a2917 9px 17px, #3b2012 17px 22px, #2a160c 22px);
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
    transition: width .12s steps(2), filter .12s steps(2); }
  body.left #spine { right: auto; left: 0;
    background: linear-gradient(270deg, #1a0d07 0 2px, #6b3c22 2px 4px, #57311c 4px 9px, #4a2917 9px 17px, #3b2012 17px 22px, #2a160c 22px); }
  #spine:hover { width: calc(var(--w) + 8px); filter: brightness(1.12); }
  /* Gold trim: two raised bands near each end (a 1 px shadow under each), and a stud between them. */
  .band { position: absolute; left: 0; right: 0; height: 2px; background: var(--gold); box-shadow: 0 1px 0 var(--gold-dk); }
  .b1 { top: 8px; } .b2 { top: 13px; } .b3 { bottom: 14px; } .b4 { bottom: 9px; }
  .stud { position: absolute; left: 50%; width: 4px; height: 4px; margin-left: -2px; background: var(--gold);
    box-shadow: 0 1px 0 var(--gold-dk), -2px 0 0 -1px var(--gold-dk); }
  .s1 { top: 24px; } .s2 { bottom: 23px; }
  /* The pixel logo, at its own 16 px so every pixel stays square. */
  .logo { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; image-rendering: pixelated; }
  /* A sliver of page edge on the inner side, like the paper block of a closed book. */
  #spine::after { content: ''; position: absolute; top: 3px; bottom: 3px; width: 2px; left: -2px;
    background: repeating-linear-gradient(180deg, #e9dfc0 0 2px, #cbbd93 2px 4px); }
  body.left #spine::after { left: auto; right: -2px; }
</style>
</head>

  <div class="stud s2"></div>
  <div class="band b3"></div><div class="band b4"></div>
</div>
<script>
  'use strict';
  const q = new URLSearchParams(location.search);
  if (q.get('edge') === 'left') document.body.classList.add('left');
  const accent = q.get('accent') || '';
  if (/^#[0-9a-f]{3,8}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
  const label = q.get('label');
  if (label) document.getElementById('spine').title = label;
  document.getElementById('spine').addEventListener('click', () => { if (window.qcSpine) window.qcSpine.open(); });
</script>
</body>
