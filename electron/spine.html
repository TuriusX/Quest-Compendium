<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium</title>
<style>
  /* The hidden panel: a slim spine peeking from the screen edge on the dock side, in the app's own lo-fi pixel style.
     Flat 2D: the panel's dark ground, a 2 px pixel border and stepped corners in the current theme's accent, small
     accent rivets, and the pixel logo. 20 px wide; hovering slides it 6 px further out (steps), a click opens the panel.
     ?edge=left|right&accent=#hex&label=… (the accent follows the app's theme). */
  :root { --accent: #a87ffb; --bg: #0e0e14; --bg2: #16161f; --w: 20px; --step: 2px; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #spine { position: absolute; top: 0; bottom: 0; right: 0; width: var(--w); cursor: pointer; box-sizing: border-box;
    image-rendering: pixelated; background: var(--accent);
    /* Stepped (pixel) corners on the free side; flush with the screen edge on the other. */
    clip-path: polygon(var(--step) 0, 100% 0, 100% 100%, var(--step) 100%, var(--step) calc(100% - var(--step)), 0 calc(100% - var(--step)), 0 var(--step), var(--step) var(--step));
    transition: width .12s steps(3); }
  body.left #spine { right: auto; left: 0;
    clip-path: polygon(0 0, calc(100% - var(--step)) 0, calc(100% - var(--step)) var(--step), 100% var(--step), 100% calc(100% - var(--step)), calc(100% - var(--step)) calc(100% - var(--step)), calc(100% - var(--step)) 100%, 0 100%); }
  /* The face: the panel's ground inside the accent border (no border on the screen-edge side). */
  #face { position: absolute; top: 2px; bottom: 2px; left: 2px; right: 0; background: var(--bg);
    box-shadow: inset 2px 0 0 var(--bg2); }
  body.left #face { left: 0; right: 2px; box-shadow: inset -2px 0 0 var(--bg2); }
  #spine:hover { width: calc(var(--w) + 6px); }
  #spine:hover #face { background: var(--bg2); }
  /* Accent rivets near each end, and a short accent rule beside each: the app's pixel UI trim. */
  .rivet { position: absolute; left: 50%; width: 4px; height: 4px; margin-left: -2px; background: var(--accent); }
  .r1 { top: 8px; } .r2 { bottom: 8px; }
  .rule { position: absolute; left: 4px; right: 4px; height: 2px; background: var(--accent); opacity: .45; }
  .u1 { top: 16px; } .u2 { bottom: 16px; }
  /* The pixel logo, at its own 16 px so every pixel stays square. */
  .logo { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="spine" title="Open Quest Compendium" role="button" aria-label="Open Quest Compendium">
  <div id="face">
    <div class="rivet r1"></div><div class="rule u1"></div>

    <div class="rule u2"></div><div class="rivet r2"></div>
  </div>
</div>
<script>
  'use strict';
  const q = new URLSearchParams(location.search);
  if (q.get('edge') === 'left') document.body.classList.add('left');
  const accent = q.get('accent') || '';
  if (/^#[0-9a-f]{3,8}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
  const label = q.get('label');
  const spine = document.getElementById('spine');
  if (label) { spine.title = label; spine.setAttribute('aria-label', label); }
  spine.addEventListener('click', () => { if (window.qcSpine) window.qcSpine.open(); });
</script>
</body>
