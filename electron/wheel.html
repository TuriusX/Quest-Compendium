<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium quick menu</title>
<style>
  /* The quick menu over the game (wheel.cjs): a ring of actions, picked with the right stick or the d-pad. */
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
               font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  :root { --accent: #a87ffb; }
  .ring { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; opacity: 0;
          transform: scale(.92); transition: opacity .12s, transform .12s; }
  body.open .ring { opacity: 1; transform: scale(1); }
  .hub { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
         background: rgba(13, 14, 21, .94); border: 2px solid var(--accent); box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
         display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 22px; box-sizing: border-box; }
  .title { font: 700 10px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: #a1a1aa; margin-bottom: 8px; }
  .label { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .keys { margin-top: 10px; font-size: 11.5px; color: #d4d4d8; display: flex; gap: 10px; }
  .g { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; margin-right: 4px;
       border-radius: 4px; font: 800 10px/1 ui-monospace, monospace; color: #16101f; }
  .g.a { background: #4ade80; } .g.b { background: #f87171; } .g.rs { background: #e4e4e7; }
  .item { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; display: flex; align-items: center;
          justify-content: center; background: rgba(19, 20, 29, .95); border: 1.5px solid rgba(255, 255, 255, .18); color: #e4e4e7;
          box-shadow: 0 6px 18px rgba(0, 0, 0, .55); transition: transform .08s, background .08s; cursor: pointer; }
  .item svg { width: 28px; height: 28px; }
  .item.on { background: var(--accent); color: #16101f; border-color: transparent; transform: scale(1.18); box-shadow: 0 0 24px var(--accent); }
  body.listening .item { opacity: .25; }
  body.listening .hub { border-color: #4ade80; box-shadow: 0 0 34px rgba(74, 222, 128, .45); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; margin-bottom: 10px; animation: pulse 1s infinite; display: none; }
  body.listening .dot { display: block; }
  @keyframes pulse { 50% { transform: scale(1.7); opacity: .4; } }
</style>
</head>
<body>
<div class="ring" id="ring">
  <div class="hub"><div class="dot"></div><div class="title" id="title"></div><div class="label" id="label"></div><div class="keys" id="keys"></div></div>
</div>
<script>
  'use strict';
  // Lucide icons (the app's set), by item key.
  const ICONS = {
    panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',
    help: '<line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>',
    shot: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
    speak: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
    find: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/>',
    log: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
    model: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
    games: '<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>',
    type: '<path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/>',
    settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.panel}</svg>`;
  const ring = document.getElementById('ring');
  let items = [];
  let strings = {};
  let sel = 0;
  let listening = false;
  let held = false; // listening while the combo is held (let go to ask), not picked with A (A asks)
  const R = 200;

  function render() {
    ring.querySelectorAll('.item').forEach((el) => el.remove());
    items.forEach((it, i) => {
      const a = (i / items.length) * Math.PI * 2;
      const el = document.createElement('div');
      el.className = 'item' + (i === sel ? ' on' : '');
      el.style.left = `${260 + Math.round(Math.sin(a) * R)}px`;
      el.style.top = `${260 - Math.round(Math.cos(a) * R)}px`;
      el.innerHTML = svg(it.key);
      el.title = it.label;
      el.addEventListener('mouseenter', () => { sel = i; paint(); });
      el.addEventListener('click', () => { sel = i; pick(); });
      ring.append(el);
    });
    paint();
  }
  function paint() {
    ring.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('on', i === sel));
    document.getElementById('title').textContent = listening ? '' : strings.title || '';
    document.getElementById('label').textContent = listening ? (held ? strings.listening : strings.listeningTap) || '' : (items[sel] && items[sel].label) || '';
    const k = (g, t) => `<span><span class="g ${g}">${g.toUpperCase()}</span>${t || ''}</span>`;
    document.getElementById('keys').innerHTML = listening ? (held ? '' : k('a', strings.ask) + k('b', strings.cancel)) : k('a', strings.select) + k('b', strings.close);
    document.body.classList.toggle('listening', listening);
  }
  function pick() {
    const it = items[sel];
    if (!it) return;
    if (it.key === 'speak') { listening = true; held = false; paint(); }
    window.qcWheel.choose(it.key);
  }
  // The stick points (x right, y up): the first item is at the top, going clockwise.
  function point(x, y) {
    if (Math.hypot(x, y) < 0.5 || !items.length) return;
    const deg = ((Math.atan2(x, y) * 180) / Math.PI + 360) % 360;
    sel = Math.round(deg / (360 / items.length)) % items.length;
    paint();
  }

  window.qcWheel.onOpen((data) => {
    items = Array.isArray(data.items) ? data.items : [];
    strings = data.strings || {};
    if (strings.accent) document.documentElement.style.setProperty('--accent', strings.accent);
    sel = 0;
    listening = false;
    held = false;
    render();
    document.body.classList.add('open');
  });
  window.qcWheel.onClose(() => { document.body.classList.remove('open'); listening = false; });
  window.qcWheel.onInput((e) => {
    if (e.type === 'listening') { listening = !!e.on; held = !!e.on; paint(); return; }
    if (e.type === 'stick') return point(e.x, e.y);
    if (e.type !== 'button') return;
    const b = e.button;
    if (listening) {
      if (b === 'a') window.qcWheel.talk('end');
      else if (b === 'b' || b === 'start') window.qcWheel.talk('cancel');
      return;
    }
    const n = items.length || 1;
    if (b === 'right' || b === 'down') { sel = (sel + 1) % n; paint(); }
    else if (b === 'left' || b === 'up') { sel = (sel + n - 1) % n; paint(); }
    else if (b === 'a') pick();
    else if (b === 'b' || b === 'start') window.qcWheel.dismiss();
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.qcWheel.dismiss(); });
</script>
</body>
</html>
