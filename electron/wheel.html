<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium quick menu</title>
<style>
  /* The quick menu over the game (wheel.cjs): a ring of actions, picked with the right stick or the d-pad. */
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
               font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  :root { --accent: #a87ffb; }
  .ring { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; opacity: 0;
          transform: scale(.92); transition: opacity .12s, transform .12s; }
  body.open .ring { opacity: 1; transform: scale(1); }
  .hub { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%;
         background: rgba(13, 14, 21, .94); border: 2px solid var(--accent); box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
         display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 22px; box-sizing: border-box; }
  .title { font: 700 10px/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: #a1a1aa; margin-bottom: 8px; }
  .label { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .keys { margin-top: 10px; font-size: 11.5px; color: #d4d4d8; display: flex; gap: 10px; }
  .g { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; margin-right: 4px;
       border-radius: 4px; font: 800 10px/1 ui-monospace, monospace; color: #16101f; }
  .g.a { background: #4ade80; } .g.b { background: #f87171; } .g.rs, .g.rb { background: #e4e4e7; }
  /* Keyboard and mouse: key caps instead of the controller's buttons, and how to point. */
  .g.kb { background: #e4e4e7; color: #16101f; font: 700 9.5px/1 'Segoe UI', system-ui, sans-serif; padding: 0 5px; }
  .aim { margin-top: 8px; font-size: 10.5px; line-height: 1.3; color: #a1a1aa; max-width: 170px; display: none; }
  body.keys .aim { display: block; }
  body.keys:not(.listening) .hub { cursor: default; }
  .item { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; display: flex; align-items: center;
          justify-content: center; background: rgba(19, 20, 29, .95); border: 1.5px solid rgba(255, 255, 255, .18); color: #e4e4e7;
          box-shadow: 0 6px 18px rgba(0, 0, 0, .55); transition: transform .08s, background .08s; cursor: pointer; }
  .item svg { width: 28px; height: 28px; }
  .item.on { background: var(--accent); color: #16101f; border-color: transparent; transform: scale(1.18); box-shadow: 0 0 24px var(--accent); }
  body.listening .item { opacity: .25; }
  body.listening .hub { border-color: #4ade80; box-shadow: 0 0 34px rgba(74, 222, 128, .45); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; margin-bottom: 10px; animation: pulse 1s infinite; display: none; }
  body.listening .dot { display: block; }
  @keyframes pulse { 50% { transform: scale(1.7); opacity: .4; } }
  /* Quick questions: a list in place of the ring (up / down or either stick, A asks, B back to the ring). */
  .list { position: absolute; left: 50%; top: 50%; width: 440px; max-height: 520px; transform: translate(-50%, -50%); display: none;
          flex-direction: column; gap: 6px; padding: 16px; box-sizing: border-box; border-radius: 18px; background: rgba(13, 14, 21, .96);
          border: 2px solid var(--accent); box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
  body.open.questions .list { display: flex; }
  body.questions .ring { display: none; }
  #qs { display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .list .q { padding: 10px 14px; border-radius: 10px; font-size: 15px; line-height: 1.3; color: #e4e4e7; background: rgba(255, 255, 255, .04); cursor: pointer; }
  .list .q.on { background: var(--accent); color: #16101f; font-weight: 700; }
  .list .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .list .head .title { margin: 0; }
  .list .head .keys { margin: 0; }

  /* ---- The fan from the orb (owner, Nov 19 2026: "the radial wheel flares out from the orb in whatever corner of the
     screen it is on inward"; wheel.cjs, fanLayout.cjs) ------------------------------------------------------------------
     With the orb on, the menu is a quarter circle with the orb at its hub, toward the screen's centre: 5 items on the
     inner ring, the rest on an outer ring. The orb's glass and the card's dark style, in the theme's colour; the items
     flare out of the orb one after another (~200 ms); the pointed item's name in a dark caption past the fan's edge,
     readable over a bright game. The window covers only the corner; the mouse reaches only the items, the caption and
     the questions list (wheel.cjs hit-tests them). */
  body.fan { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #ece9f4; }
  #fan { position: absolute; inset: 0; display: none; }
  body.fan .ring { display: none; }
  body.fan #fan { display: block; }
  body.fan.questions #fan { display: none; }
  #fanBack { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; opacity: 0; transform: scale(.15);
             transform-origin: var(--hx) var(--hy); transition: opacity .16s linear, transform .24s cubic-bezier(.2, .9, .3, 1.08); }
  body.open #fanBack { opacity: 1; transform: none; }
  .fi { position: absolute; width: var(--sz); height: var(--sz); margin: calc(var(--sz) / -2) 0 0 calc(var(--sz) / -2); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; box-sizing: border-box; cursor: pointer;
        background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 55%), rgba(13, 12, 20, .93);
        border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); color: #ece9f4;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .10);
        opacity: 0; transform: translate(var(--bx), var(--by)) scale(.2);
        /* (the highlight itself swaps at once: only the flare is animated) */
        transition: transform .17s cubic-bezier(.2, .9, .3, 1.3) var(--dl), opacity .1s linear var(--dl); }
  .fi svg { width: 46%; height: 46%; }
  .fi.r1 { border-color: color-mix(in srgb, var(--accent) 38%, transparent); }
  body.open .fi { opacity: 1; transform: none; }
  body.open .fi.on { transform: scale(1.16); background: var(--accent); color: #16101f; border-color: transparent;
                     box-shadow: 0 0 24px var(--accent), 0 6px 18px rgba(0, 0, 0, .5); transition-delay: 0s; }
  body.listening .fi { opacity: .25; }
  /* The fan's own hub, where the orb isn't showing (a card is out, or Hide until next answer). */
  .fhub { position: absolute; width: var(--hd); height: var(--hd); margin: calc(var(--hd) / -2) 0 0 calc(var(--hd) / -2); border-radius: 50%; display: none;
          background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 35%, white), var(--accent) 45%, color-mix(in srgb, var(--accent) 50%, black));
          box-shadow: 0 0 18px var(--accent), 0 0 4px rgba(255, 255, 255, .6) inset; opacity: .95; }
  body.fandot .fhub { display: block; }
  .fcap { position: absolute; max-width: var(--cw); box-sizing: border-box; padding: calc(10px * var(--s)) calc(14px * var(--s)); border-radius: calc(14px * var(--s));
          background: rgba(13, 12, 20, .94); border: 2px solid var(--accent); box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
          opacity: 0; transition: opacity .16s linear .1s; pointer-events: auto; }
  body.open .fcap { opacity: 1; }
  .fcap .title { font: 700 calc(9.5px * var(--s))/1 ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: #a49db8; margin-bottom: calc(6px * var(--s)); }
  .fcap .flabel { font-size: calc(16.5px * var(--s)); font-weight: 800; line-height: 1.2; }
  .fcap .flabel:empty { display: none; }
  .fcap .fhint { font-size: calc(11.5px * var(--s)); line-height: 1.3; color: #a49db8; margin-top: calc(4px * var(--s)); }
  .fcap .fhint:empty { display: none; }
  .fcap .keys { margin-top: calc(8px * var(--s)); font-size: calc(11.5px * var(--s)); flex-wrap: wrap; }
  .fcap .keys:empty { display: none; }
  body.fan .list { left: auto; top: auto; transform: none; border-radius: 16px; background: rgba(13, 12, 20, .96); font-family: inherit; }
  @media (prefers-reduced-motion: reduce) { #fanBack, .fi, .fcap { transition: none; } }
</style>
<!-- The app's own face (as the card has it), for the fan; without the network, the system face stands in. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="list" id="list"><div class="head"><div class="title" id="qtitle"></div><div class="keys" id="qkeys"></div></div><div id="qs"></div></div>
<div id="fan"><svg id="fanBack"></svg><div id="fanItems"></div><div class="fhub" id="fhub"></div>
  <div class="fcap" id="fcap"><div class="title" id="ftitle"></div><div class="flabel" id="flabel"></div><div class="fhint" id="fhint"></div><div class="keys" id="fkeys"></div></div></div>
<div class="ring" id="ring">
  <div class="hub"><div class="dot"></div><div class="title" id="title"></div><div class="label" id="label"></div><div class="keys" id="keys"></div><div class="aim" id="aim"></div></div>
</div>
<script src="ringPoint.js"></script>
<script src="fanLayout.cjs"></script>
<script>
  'use strict';
  // Lucide icons (the app's set), by item key.
  const ICONS = {
    panel: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',
    answer: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M13 8H7"/><path d="M17 12H7"/>',
    back: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
    // A hint's next level (lightbulb), more of the answer on the card (chevrons down), Where was I? (history).
    hint: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
    more: '<path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/>',
    // The last card back over the game (the orb's left click, for pads; Nov 19 2026): reply.
    last: '<polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',
    recap: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
    questions: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
    help: '<line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>',
    shot: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
    speak: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
    find: '<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/>',
    log: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
    model: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
    games: '<line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>',
    type: '<path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/>',
    settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.panel}</svg>`;
  const ring = document.getElementById('ring');
  let items = [];
  let strings = {};
  let sel = 0;
  let listening = false;
  let held = false; // listening while the combo is held (let go to ask), not picked with A (A asks)
  let questions = []; // [{ key, label }]: the quick questions list (its own view)
  let inList = false;
  let qsel = 0;
  let lastStep = 0; // a stick held up / down steps through the list at this pace
  const pointer = window.qcRingPoint.createRingPointer();
  const R = 200;
  // Keyboard and mouse (owner, Nov 18 2026): opened with the quick menu shortcut. While its keys are held the mouse
  // points (an offset from where the cursor was) and letting go picks; a quick tap, or letting go without pointing,
  // leaves it open: the arrows and Enter, a click, or 1-9 pick, Esc closes.
  let mode = 'pad';
  let releaseKeys = [];
  let holding = false;
  let openedAt = 0;
  let aimed = false;
  const AIM_DEAD = 36; // px the mouse moves before it points
  const TAP_MS = 250;

  // The fan from the orb (owner, Nov 19 2026; fanLayout.cjs): where it is ({ corner, scale, hub, dot } from wheel.cjs),
  // its layout, the ring the sticks point on (the shoulder buttons switch), the item the mouse is over.
  const Fan = window.qcFan;
  let fan = null;
  let L = null;
  let fring = 0;
  let hoverI = -1;

  // The player's controller's names and colours for A and B (controller mode step 4), when the app sent them.
  function keysHtml(g, t) {
    if (mode === 'keys' || mode === 'mouse') {
      // The keyboard's keys (their names aren't translated, like the keys themselves).
      const cap = document.createElement('span');
      cap.textContent = g === 'a' ? 'Enter' : 'Esc';
      const label = document.createElement('span');
      label.textContent = t || '';
      return `<span><span class="g kb">${cap.innerHTML}</span>${label.innerHTML}</span>`;
    }
    const gl = strings.glyphs && strings.glyphs[g];
    const look = gl ? ` style="background:${gl.bg};color:${gl.fg};border-radius:${gl.round ? '999px' : '4px'}"` : '';
    const span = document.createElement('span');
    span.textContent = gl ? gl.text : g.toUpperCase();
    const label = document.createElement('span');
    label.textContent = t || '';
    return `<span><span class="g ${g}"${look}>${span.innerHTML}</span>${label.innerHTML}</span>`;
  }

  function render() {
    if (fan) return renderFan();
    ring.querySelectorAll('.item').forEach((el) => el.remove());
    items.forEach((it, i) => {
      const a = (i / items.length) * Math.PI * 2;
      const el = document.createElement('div');
      el.className = 'item' + (i === sel ? ' on' : '');
      el.style.left = `${260 + Math.round(Math.sin(a) * R)}px`;
      el.style.top = `${260 - Math.round(Math.cos(a) * R)}px`;
      el.innerHTML = svg(it.key);
      el.title = it.label;
      el.addEventListener('mouseenter', () => { sel = i; paint(); });
      el.addEventListener('click', () => { sel = i; pick(); });
      ring.append(el);
    });
    paint();
  }
  function paint() {
    const label = listening ? (held ? strings.listening : mode === 'keys' ? strings.listeningKeys || strings.listeningTap : strings.listeningTap) || '' : (items[sel] && items[sel].label) || '';
    const k = keysHtml;
    let keys = listening ? (held ? '' : k('a', strings.ask) + k('b', strings.cancel)) : k('a', strings.select) + k('b', strings.close);
    document.body.classList.toggle('listening', listening);
    if (fan) {
      // The fan's caption: the pointed item's name; nothing pointed yet, how to point.
      document.querySelectorAll('#fanItems .fi').forEach((el) => el.classList.toggle('on', Number(el.dataset.i) === sel));
      if (!listening && mode === 'mouse') keys = k('b', strings.close);
      if (!listening && mode === 'pad' && L && L.outer && strings.fanMore) keys += k('rb', strings.fanMore);
      document.getElementById('ftitle').textContent = strings.title || '';
      document.getElementById('flabel').textContent = label;
      document.getElementById('fhint').textContent = listening || sel >= 0 ? '' : mode === 'keys' ? strings.aim || '' : mode === 'mouse' ? strings.fanClick || '' : '';
      document.getElementById('fkeys').innerHTML = keys;
      requestAnimationFrame(fanHits);
      return;
    }
    ring.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('on', i === sel));
    document.getElementById('title').textContent = listening ? '' : strings.title || '';
    document.getElementById('label').textContent = label;
    document.getElementById('keys').innerHTML = keys;
    document.getElementById('aim').textContent = mode === 'keys' && !listening ? strings.aim || '' : '';
  }

  // ---- The fan ------------------------------------------------------------------------------------------------------
  function renderFan() {
    const s = fan.scale;
    L = Fan.layout(items.length, fan.corner, s);
    const hx = fan.hub.x, hy = fan.hub.y;
    const root = document.documentElement.style;
    root.setProperty('--s', String(s));
    root.setProperty('--hx', `${hx}px`);
    root.setProperty('--hy', `${hy}px`);
    root.setProperty('--hd', `${Math.round(26 * s)}px`);
    root.setProperty('--cw', `${L.caption.w}px`);
    // The fan's glass behind the items: a quarter ring from just outside the orb to past the outer ring.
    const pt = (t, R) => [hx + L.hx * Math.cos(t * Math.PI / 2) * R, hy + L.vy * Math.sin(t * Math.PI / 2) * R].map((v) => v.toFixed(1)).join(' ');
    const r0 = Math.round(44 * s), r9 = L.reach + Math.round(12 * s);
    const sw = L.hx * L.vy > 0 ? 1 : 0;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#a87ffb';
    document.getElementById('fanBack').innerHTML =
      `<defs><radialGradient id="fg" gradientUnits="userSpaceOnUse" cx="${hx}" cy="${hy}" r="${r9}">` +
      `<stop offset="0" stop-color="${accent}" stop-opacity=".22"/><stop offset=".35" stop-color="#0d0c14" stop-opacity=".5"/><stop offset="1" stop-color="#0d0c14" stop-opacity=".62"/></radialGradient></defs>` +
      `<path d="M ${pt(0, r9)} A ${r9} ${r9} 0 0 ${sw} ${pt(1, r9)} L ${pt(1, r0)} A ${r0} ${r0} 0 0 ${1 - sw} ${pt(0, r0)} Z" fill="url(#fg)" stroke="${accent}" stroke-opacity=".35" stroke-width="1.5"/>` +
      (L.outer ? `<path d="M ${pt(0, (L.r1 + L.r2) / 2)} A ${(L.r1 + L.r2) / 2} ${(L.r1 + L.r2) / 2} 0 0 ${sw} ${pt(1, (L.r1 + L.r2) / 2)}" fill="none" stroke="${accent}" stroke-opacity=".16" stroke-width="1"/>` : '');
    const box = document.getElementById('fanItems');
    box.innerHTML = '';
    for (const it of L.items) {
      const el = document.createElement('div');
      el.className = 'fi' + (it.ring ? ' r1' : '');
      el.dataset.i = String(it.i);
      el.style.left = `${hx + it.x}px`;
      el.style.top = `${hy + it.y}px`;
      el.style.setProperty('--sz', `${it.size}px`);
      el.style.setProperty('--bx', `${-it.x}px`);
      el.style.setProperty('--by', `${-it.y}px`);
      // One after another over 90 ms whatever the count, each flaring for 170 ms: all out in ~260 ms.
      el.style.setProperty('--dl', `${Math.round((90 * it.i) / Math.max(1, L.items.length - 1))}ms`);
      el.innerHTML = svg(items[it.i].key);
      // A click is a pick (the mouse reaches the items only: wheel.cjs lets it in over them).
      el.addEventListener('click', () => { sel = it.i; pick(); });
      box.append(el);
    }
    const hub = document.getElementById('fhub');
    hub.style.left = `${hx}px`;
    hub.style.top = `${hy}px`;
    document.body.classList.toggle('fandot', !!fan.dot);
    // The caption past the fan's edge, growing away from the hub.
    const cap = document.getElementById('fcap');
    cap.style.left = cap.style.right = cap.style.top = cap.style.bottom = '';
    if (L.hx < 0) cap.style.right = `${innerWidth - (hx + L.caption.x)}px`; else cap.style.left = `${hx + L.caption.x}px`;
    if (L.vy < 0) cap.style.bottom = `${innerHeight - (hy + L.caption.y)}px`; else cap.style.top = `${hy + L.caption.y}px`;
    paint();
  }
  /** The fan's parts the mouse may reach (where they end up, not mid-flare), for wheel.cjs to let the mouse in. */
  let lastFanHits = '';
  function fanHits() {
    if (!fan || !L) return;
    const list = [];
    const r = (id, b, i) => list.push({ id, i, x: Math.round(b.left), y: Math.round(b.top), w: Math.round(b.width), h: Math.round(b.height) });
    if (inList) r('list', document.getElementById('list').getBoundingClientRect(), -1);
    else {
      for (const it of L.items) list.push({ id: 'item', i: it.i, x: fan.hub.x + it.x - it.size / 2, y: fan.hub.y + it.y - it.size / 2, w: it.size, h: it.size });
      r('caption', document.getElementById('fcap').getBoundingClientRect(), -1);
    }
    const key = JSON.stringify(list);
    if (key === lastFanHits) return;
    lastFanHits = key;
    window.qcWheel.hits(list);
  }
  /** A step along the fan (the d-pad, the arrow keys): inner ring first, then the outer; from nothing, the first or last. */
  function stepFan(d) {
    const n = items.length;
    if (!n) return;
    sel = sel < 0 ? (d > 0 ? 0 : n - 1) : (sel + d + n) % n;
    fring = L && L.items[sel] ? L.items[sel].ring : 0;
    paint();
  }

  function pick() {
    // Only an item that's pointed at (owner, Nov 19 2026): with nothing pointed (sel -1), nothing happens.
    const it = sel >= 0 ? items[sel] : null;
    if (!it) return;
    if (it.key === 'questions') return openList();
    if (it.key === 'speak') { listening = true; held = false; paint(); }
    window.qcWheel.choose(it.key);
  }

  // Quick questions: their own list in place of the ring.
  function openList() {
    if (!questions.length) return;
    inList = true;
    qsel = 0;
    renderList();
    const box = document.getElementById('list');
    box.style.left = box.style.right = box.style.top = box.style.bottom = '';
    if (fan && L) {
      // The fan: the list in its corner, beside the orb (not in the middle of the game).
      const s = fan.scale;
      if (L.hx < 0) box.style.right = `${innerWidth - fan.hub.x - Math.round(30 * s)}px`; else box.style.left = `${fan.hub.x - Math.round(30 * s)}px`;
      if (L.vy < 0) box.style.bottom = `${innerHeight - fan.hub.y + Math.round(62 * s)}px`; else box.style.top = `${fan.hub.y + Math.round(62 * s)}px`;
    }
    document.body.classList.add('questions');
    if (fan) requestAnimationFrame(fanHits);
  }
  function closeList() {
    inList = false;
    document.body.classList.remove('questions');
    paint();
  }
  function renderList() {
    document.getElementById('qtitle').textContent = strings.questionsTitle || '';
    const box = document.getElementById('qs');
    box.innerHTML = '';
    questions.forEach((q, i) => {
      const el = document.createElement('div');
      el.className = 'q';
      el.textContent = q.label;
      el.addEventListener('mouseenter', () => { qsel = i; paintList(); });
      el.addEventListener('click', () => { qsel = i; askListed(); });
      box.append(el);
    });
    paintList();
  }
  function paintList() {
    document.querySelectorAll('#qs .q').forEach((el, i) => el.classList.toggle('on', i === qsel));
    document.getElementById('qkeys').innerHTML = keysHtml('a', strings.ask) + keysHtml('b', strings.back || strings.close);
  }
  function askListed() {
    const q = questions[qsel];
    if (q) window.qcWheel.choose('q:' + q.key);
  }
  function stepList(d) {
    const n = questions.length || 1;
    qsel = (qsel + d + n) % n;
    paintList();
  }

  window.qcWheel.onOpen((data) => {
    items = Array.isArray(data.items) ? data.items : [];
    strings = data.strings || {};
    questions = Array.isArray(data.questions) ? data.questions : [];
    mode = data.mode === 'keys' || data.mode === 'mouse' ? data.mode : 'pad';
    releaseKeys = Array.isArray(data.keys) ? data.keys.map((k) => String(k).toLowerCase()) : [];
    holding = mode === 'keys' && releaseKeys.length > 0;
    openedAt = Date.now();
    aimed = false;
    document.body.classList.toggle('keys', mode === 'keys');
    inList = false;
    document.body.classList.remove('questions', 'open');
    pointer.reset();
    fan = data.fan && data.fan.hub ? data.fan : null;
    document.body.classList.toggle('fan', !!fan);
    const accent = (fan && fan.accent) || strings.accent;
    if (accent) document.documentElement.style.setProperty('--accent', accent);
    // The fan opens with nothing pointed at (owner, Nov 19 2026: opening never picks anything; A / Enter with nothing
    // pointed do nothing). The full ring starts on its first item, as before.
    sel = fan ? -1 : 0;
    fring = 0;
    hoverI = -1;
    lastFanHits = '';
    listening = false;
    held = false;
    render();
    void document.body.offsetWidth; // (the fan's items start at the orb, so they flare out)
    document.body.classList.add('open');
    if (fan) setTimeout(fanHits, 260);
  });
  window.qcWheel.onClose(() => { document.body.classList.remove('open'); listening = false; });
  window.qcWheel.onInput((e) => {
    if (e.type === 'listening') { listening = !!e.on; held = !!e.on; paint(); return; }
    if (e.type === 'hover') {
      // The fan: the mouse over an item (wheel.cjs hit-tests it) points at it; off the items, nothing is pointed.
      hoverI = Number.isInteger(e.i) ? e.i : -1;
      if (!fan || inList || listening) return;
      if (hoverI >= 0) { sel = hoverI; aimed = true; fring = L && L.items[sel] ? L.items[sel].ring : fring; }
      else { aimed = false; if (mode === 'mouse') sel = -1; }
      paint();
      return;
    }
    if (e.type === 'aim') {
      // The mouse, as an offset from where it was when the menu opened: far enough out, it points like a stick.
      if (inList || listening || !items.length) return;
      const dx = Number(e.dx) || 0, dy = Number(e.dy) || 0;
      if (fan) {
        if (hoverI >= 0) return; // on an item itself: that one
        const i = Fan.aimAt(dx, dy, L);
        if (i === null) { if (aimed) { aimed = false; sel = -1; paint(); } return; }
        aimed = true;
        if (i !== sel) { sel = i; paint(); }
        return;
      }
      // Back in the middle: nothing is pointed at, so letting go picks nothing (owner, Nov 19 2026).
      if (Math.hypot(dx, dy) < AIM_DEAD) { aimed = false; return; }
      aimed = true;
      const turn = (Math.atan2(dx, -dy) / (Math.PI * 2) + 1) % 1;
      const i = Math.round(turn * items.length) % items.length;
      if (i !== sel) { sel = i; paint(); }
      return;
    }
    if (e.type === 'stick') {
      if (inList) {
        // Either stick, up or down: a step, then steps at a steady pace while it's held.
        const now = Date.now();
        if (!e.x && !e.y) lastStep = 0;
        else if (Math.abs(e.y) > 0.6 && Math.abs(e.y) > Math.abs(e.x) && now - lastStep > 220) { lastStep = now; stepList(e.y > 0 ? -1 : 1); }
        return;
      }
      if (listening) return;
      if (fan) {
        // Either stick points along the fan on its ring (the shoulder buttons switch rings); let go, it stays.
        const i = Fan.stickAt(Number(e.x) || 0, Number(e.y) || 0, L, fring);
        if (i !== null && i !== sel) { sel = i; paint(); }
        return;
      }
      const i = pointer.stick(e.which === 'left' ? 'left' : 'right', e.x, e.y, items.length);
      if (i !== null) { sel = i; paint(); }
      return;
    }
    if (e.type !== 'button') return;
    const b = e.button;
    if (listening) {
      if (b === 'a') window.qcWheel.talk('end');
      else if (b === 'b' || b === 'start') window.qcWheel.talk('cancel');
      return;
    }
    const dir = b === 'up' || b === 'down' || b === 'left' || b === 'right';
    if (inList) {
      // The left stick's directions come as 'stick' above; the d-pad steps (and repeats while held).
      if (dir) { if (e.src !== 'stick' && (b === 'up' || b === 'down')) stepList(b === 'up' ? -1 : 1); }
      else if (b === 'a') askListed();
      else if (b === 'b') closeList();
      else if (b === 'start') window.qcWheel.dismiss();
      return;
    }
    if (fan && (b === 'lb' || b === 'rb')) {
      // The other ring: the item there nearest the one pointed at (or just the ring, with nothing pointed yet).
      if (!L || !L.outer) return;
      const o = sel >= 0 ? Fan.otherRing(L, sel) : null;
      if (o !== null) { sel = o; fring = L.items[o].ring; } else fring = b === 'rb' ? 1 : 0;
      paint();
      return;
    }
    if (dir) {
      // The fan: the d-pad steps along it (up / left back, down / right on).
      if (fan) { if (e.src !== 'stick') stepFan(b === 'up' || b === 'left' ? -1 : 1); return; }
      // Both sticks point through 'stick'; the d-pad points too, a fresh press at a time.
      if (e.src !== 'stick' && !e.repeat) { sel = pointer.dpad(b, Date.now(), items.length, sel); paint(); }
    }
    else if (b === 'a') pick();
    else if (b === 'b' || b === 'start') window.qcWheel.dismiss();
  });
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'Escape') {
      if (listening) return window.qcWheel.talk('cancel');
      if (inList) closeList();
      else window.qcWheel.dismiss();
      return;
    }
    if (holding && releaseKeys.includes(k.toLowerCase())) return; // the shortcut's own keys, still held
    if (listening) { if (k === 'Enter' || k === ' ') { e.preventDefault(); window.qcWheel.talk('end'); } return; }
    if (inList) {
      if (k === 'ArrowUp' || k === 'ArrowDown') { e.preventDefault(); stepList(k === 'ArrowUp' ? -1 : 1); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); askListed(); }
      else if (k === 'Backspace' || k === 'ArrowLeft') closeList();
      return;
    }
    const n = items.length || 1;
    if (fan && (k === 'ArrowRight' || k === 'ArrowDown' || k === 'Tab' || k === 'ArrowLeft' || k === 'ArrowUp')) {
      e.preventDefault();
      stepFan(k === 'ArrowLeft' || k === 'ArrowUp' || (k === 'Tab' && e.shiftKey) ? -1 : 1);
    }
    else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'Tab') { e.preventDefault(); sel = (sel + (e.shiftKey && k === 'Tab' ? -1 : 1) + n) % n; paint(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + n) % n; paint(); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); pick(); }
    else if (/^[1-9]$/.test(k) && Number(k) <= items.length) { sel = Number(k) - 1; paint(); pick(); }
  });
  // Letting go of the shortcut: pointed somewhere, that's picked; a quick tap (or no pointing) leaves the menu open.
  // Nothing pointed at when the keys come up: nothing happens (owner, Nov 19 2026; fanLayout.releasePicks).
  window.addEventListener('keyup', (e) => {
    if (!holding || !releaseKeys.includes(String(e.key).toLowerCase())) return;
    holding = false;
    if (Fan.releasePicks({ aimed, sel, inList, listening, heldMs: Date.now() - openedAt, tapMs: TAP_MS })) pick();
  });
  // The window lost the keys (the focus went elsewhere while they were held): no pick on a key-up that never comes.
  window.addEventListener('blur', () => { holding = false; });
</script>
</body>
</html>
