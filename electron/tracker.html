<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium objectives</title>
<style>
  /* The objectives tracker: a quest log drawn straight onto the game with a shadow, no card. Three states — full,
     collapsed (one header line: click the title) and away (a ribbon bookmark at the screen edge). Hovering shows the controls. The sections
     scroll inside once the tracker reaches its height limit (--maxh, from the app: 70% of the screen). */
  :root {
    --accent: #a87ffb;
    --scale: 1;            /* the app's UI scale (Settings) */
    --fs: calc(16px * var(--scale)); /* text size: 14 / 16 / 19 (small / medium / large) times the scale */
    --alpha: 1;            /* whole-tracker transparency, from the slider */
    --ink: #f3eefc;
    --dim: rgba(243, 238, 252, .55);
    --done: rgba(243, 238, 252, .38);
    --warn: #ffc14d;
    --ok: #4ade80;
    --shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.85), 0 2px 10px rgba(0,0,0,.6);
    --maxh: 70vh;
    --bd: .45;            /* the backdrop's darkness at its centre (the Backdrop slider) */          /* the tallest the tracker may grow (set by the app in px) */
  }
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%;
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: var(--fs); color: var(--ink); user-select: none; }
  body.demo { background: #2a3a2a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%2335553a"/><rect x="20" y="20" width="20" height="20" fill="%232e4a33"/><rect width="20" height="20" fill="%232e4a33"/></svg>'); }

  #tracker { position: absolute; left: 4px; top: 4px; display: inline-flex; flex-direction: column; opacity: var(--alpha);
    text-shadow: var(--shadow); max-width: 26em; max-height: calc(var(--maxh) - 10px); box-sizing: border-box;
    padding: .35em .6em .5em .6em; border-radius: .5em; }
  /* The soft dark backdrop (the Backdrop slider, 0 = off to 95%): a gradient that fades out, so it reads as a shade
     behind the text rather than a box. --bd is the darkness at its centre; at the top of the range the centre is nearly
     opaque and only the edges fade. */
  #tracker.backdrop { background: radial-gradient(ellipse at 45% 40%, rgba(10,8,18,var(--bd)) 0%, rgba(10,8,18,var(--bd)) 38%,
    rgba(10,8,18,calc(var(--bd) * .72)) 68%, rgba(10,8,18,0) 100%); }
  /* Area navigation on the place line: ‹ › step through the guide's areas, the name opens the list of them. */
  .place .arr { cursor: pointer; color: var(--dim); font-weight: 800; font-size: 1.15em; line-height: 1; padding: 0 .15em; }
  .place .arr:hover { color: #fff; }
  .place .arr.dis { opacity: .25; cursor: default; }
  .place .arr.off { display: none; }
  .place .name.pick { cursor: pointer; text-decoration: underline dotted rgba(243,238,252,.4); text-underline-offset: .2em; }
  .arealist { max-height: 12em; overflow-y: auto; margin: 0 0 .35em 1.3em; padding-left: .5em; font-size: .85em;
    border-left: 2px solid rgba(255,255,255,.15); scrollbar-width: thin; scrollbar-color: rgba(243,238,252,.35) transparent; }
  .arealist.off { display: none; }
  .arealist .ai { cursor: pointer; color: var(--dim); line-height: 1.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arealist .ai:hover { color: #fff; }
  .arealist .ai.cur { color: var(--accent); font-weight: 700; }
  /* Shortening: an entry's × hides it, "Show N hidden" brings them back, the count cycles 3 / 6 / all. */
  li .x { margin-left: auto; padding-left: .45em; flex-shrink: 0; color: var(--dim); font-weight: 800; cursor: pointer; opacity: 0; }
  li:hover .x { opacity: .8; }
  li .x:hover { color: #fff; opacity: 1; }
  .unhide { font-size: .74em; color: var(--dim); font-style: italic; cursor: pointer; margin: .1em 0 0 1.75em; }
  .unhide:hover { color: var(--ink); }
  .sechead .cnt { cursor: pointer; border-bottom: 1px dotted transparent; }
  .sechead .cnt:hover { border-bottom-color: currentColor; }
  .notice { font-size: .8em; color: var(--warn); margin-top: .3em; line-height: 1.3; }
  .notice:empty { display: none; }
  #tracker.collapsed .arealist, #tracker.collapsed .notice { display: none; }
  /* "Locate me": a crosshair right after the place name, as tall as the place text; its label slides out on hover. */
  .place .loc { display: inline-flex; vertical-align: -.25em; margin: 0 .2em 0 .35em; align-items: center; gap: .3em; height: 1.35em; padding: 0 .3em; border-radius: 3px; box-sizing: border-box;
    border: 1px solid rgba(168,127,251,.55); background: rgba(16,12,28,.55); color: var(--accent); cursor: pointer;
    text-shadow: none; flex-shrink: 0; }
  .place .loc svg { width: 1em; height: 1em; }
  .place .loc .ll { font-size: .8em; font-weight: 700; color: var(--ink); white-space: nowrap; max-width: 0; overflow: hidden;
    transition: max-width .15s steps(3); }
  .place .loc:hover { border-color: var(--accent); background: rgba(168,127,251,.18); }
  .place .loc:hover .ll { max-width: 9em; }
  .place .loc.busy svg { animation: qcspin 1.1s linear infinite; }
  @keyframes qcspin { to { transform: rotate(360deg); } }
  /* While locating, the place line says only "Locating…" until the result arrives. */
  .place.locating .arr, .place.locating .story, .place.locating .tick, .place.locating .confirm { display: none; }
  .place.locating .name { color: var(--dim); font-style: italic; text-decoration: none; }
  #tracker.collapsed .body, #tracker.collapsed .warn, #tracker.collapsed .hint, #tracker.collapsed .place,
  #tracker.collapsed .quest, #tracker.collapsed .next { display: none; }
  #tracker.away { display: none; }

  /* The header: the title (with the count and a chevron) folds the whole log to this line and back; the book at the
     right end opens the panel; dragging anywhere on it moves the tracker. */
  .head { display: flex; align-items: center; gap: .45em; cursor: pointer; line-height: 1.25; }
  .head .tg { display: inline-flex; align-items: center; gap: .45em; padding: 0 .3em; margin-left: -.3em; border-radius: 3px; }
  .head .tg:hover { background: rgba(255,255,255,.09); }
  .head .tg:hover .title { color: #fff; }
  .title { font-weight: 800; font-size: 1.05em; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .count { font-weight: 700; color: var(--dim); font-size: .9em; }
  .chev { color: var(--dim); font-size: .8em; display: inline-block; width: .8em; text-align: center; }
  .head .tg:hover .chev { color: var(--ink); }
  .head .book { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 1.7em; height: 1.35em;
    border-radius: 3px; border: 1px solid rgba(255,255,255,.14); background: rgba(16,12,28,.7); color: var(--accent);
    text-shadow: none; opacity: .7; transition: opacity .12s steps(2); }
  #tracker:hover .head .book { opacity: 1; }
  .head .book:hover { border-color: var(--accent); background: rgba(168,127,251,.2); color: #fff; }
  .head .book svg { width: 1.15em; height: .9em; image-rendering: pixelated; }

  .place { display: flex; align-items: center; gap: .4em; margin: .15em 0 .35em 0; font-size: .9em; color: var(--dim); cursor: pointer; line-height: 1.3; }
  .place .pin { color: var(--accent); flex-shrink: 0; width: .95em; height: .95em; }
  .place .name { color: var(--ink); font-weight: 600; }
  .place .story { opacity: .85; }
  .place .confirm { margin-left: .25em; font-size: .85em; font-weight: 700; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 0 .55em; line-height: 1.5; opacity: .9; transition: opacity .15s; }
  .place:hover .confirm { opacity: 1; filter: brightness(1.2); }
  .place.sure .confirm { display: none; }
  .place.sure .tick { color: var(--ok); font-weight: 800; }
  .place:not(.sure) .tick { display: none; }

  .source { font-size: .78em; color: var(--dim); font-style: italic; margin: -.15em 0 .25em 0; }
  .source:empty { display: none; }
  #tracker.collapsed .source { display: none; }
  .quest { font-weight: 700; font-size: 1.02em; line-height: 1.3; margin: .1em 0 .2em 0; color: #fff; }
  /* The sections scroll here once the tracker is at its height limit; the scrollbar only shows while hovered. */
  .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: .2em;
    scrollbar-width: thin; scrollbar-color: transparent transparent; }
  #tracker:hover .body { scrollbar-color: rgba(243,238,252,.35) transparent; }
  ol { list-style: none; margin: 0; padding: 0; }
  .none { color: var(--dim); font-size: .9em; margin: .2em 0; }
  .sec { margin-top: .4em; }
  .sechead { display: flex; align-items: center; gap: .4em; cursor: pointer; font-size: .74em; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; color: var(--dim); line-height: 1.5; padding: 0 .35em; margin: 0 -.35em;
    border-radius: 3px; }
  .sechead:hover { color: var(--ink); background: rgba(255,255,255,.09); }
  .sechead svg { width: 1.1em; height: 1.1em; }
  .sechead .cnt { font-weight: 700; letter-spacing: 0; opacity: .85; }
  .sechead .chev { margin-left: auto; }
  .sec.amber .sechead { color: var(--warn); }
  .sec.folded ol, .sec.folded .more, .sec.folded .unhide { display: none; }
  .more { font-size: .78em; font-weight: 700; color: var(--accent); cursor: pointer; margin: .1em 0 0 1.75em; }
  .more:hover { filter: brightness(1.25); }
  /* A guide entry: an empty square that fills in when collected. An info line (a point of no return): no box. */
  .box { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: 1.05em; height: 1.05em;
    margin-top: .17em; border: 1.5px solid rgba(243,238,252,.7); border-radius: 2px; font-size: .78em; font-weight: 800;
    color: #16101f; box-shadow: 0 0 0 1px rgba(0,0,0,.5); text-shadow: none; }
  li.done .box { background: #6b6678; border-color: #6b6678; color: #e9e6f0; }
  li.miss .box { border-color: var(--warn); }
  li.info { cursor: default; }
  li.info .obj { color: var(--warn); font-weight: 600; }
  li.info .where { color: var(--ink); opacity: .8; }
  li.static { cursor: default; }
  li.miss:not(.done) .obj { color: #ffe1a6; }
  .next { display: flex; align-items: center; gap: .5em; margin-top: .45em; font-size: .88em; color: var(--dim); }
  .next .nm { color: var(--ink); font-weight: 600; }
  .next .go { margin-left: auto; font-size: .85em; font-weight: 700; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 0 .6em; line-height: 1.55; cursor: pointer; white-space: nowrap; text-shadow: none;
    background: rgba(16,12,28,.55); }
  .next .go:hover { filter: brightness(1.25); }
  .next.off { display: none; }
  /* An entry: ticking happens only on its square (or number) badge; clicking the text opens its details in place. */
  li { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 .5em; line-height: 1.35; margin: .2em 0; cursor: default; }
  li .obj { flex: 1 1 0; min-width: 0; cursor: pointer; }
  li .obj:hover, li.open .obj { color: #fff; }
  li .badge.tk, li .box.tk { cursor: pointer; }
  li .badge.tk:hover, li .box.tk:hover { filter: brightness(1.25); box-shadow: 0 0 0 1.5px var(--accent), 0 2px 4px rgba(0,0,0,.6); }
  li .ex { color: var(--dim); font-size: .8em; margin-left: .3em; opacity: 0; transition: opacity .12s steps(2); }
  li .obj:hover .ex { opacity: .9; }
  li.open .ex { opacity: .9; }
  /* The details: everything the guide has on the entry, then "Open in guide" and "Ask about this". */
  li .det { flex: 0 0 100%; box-sizing: border-box; margin: .25em 0 .35em 1.55em; padding: .35em .55em .45em .55em;
    border-left: 2px solid var(--accent); background: rgba(10,8,18,.55); border-radius: 0 3px 3px 0; font-size: .86em;
    line-height: 1.4; color: var(--ink); cursor: default; }
  li .det .dl { margin: .1em 0; }
  li .det .dk { font-weight: 800; color: var(--accent); font-size: .82em; letter-spacing: .06em; text-transform: uppercase; margin-right: .4em; }
  li .det .dk.amber { color: var(--warn); }
  li .det .dacts { display: flex; gap: .4em; margin-top: .45em; flex-wrap: wrap; }
  li .det .dbtn { font-size: .85em; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px;
    padding: .05em .55em; cursor: pointer; text-shadow: none; background: rgba(16,12,28,.7); }
  li .det .dbtn:hover { background: var(--accent); color: #16101f; }
  li.done .det .dl { text-decoration: none; }
  .badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 1.25em; height: 1.25em;
    padding: 0 .3em; margin-top: .12em; border-radius: 2px; background: var(--accent); color: #16101f; font-size: .78em;
    font-weight: 800; text-shadow: none; box-shadow: 0 0 0 1.5px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.6);
    transition: background .2s steps(3), color .2s steps(3); }
  .obj { font-weight: 500; }
  .obj .where { color: var(--dim); font-weight: 400; }
  li.done .badge { background: #6b6678; color: #e9e6f0; }
  li.done .obj { color: var(--done); text-decoration: line-through; text-decoration-color: rgba(243,238,252,.35); }
  li.done .where { display: none; }

  .warn { display: flex; align-items: flex-start; gap: .4em; margin-top: .4em; font-size: .9em; color: var(--warn); font-weight: 600; line-height: 1.3; }
  .warn svg { width: 1em; height: 1em; flex-shrink: 0; margin-top: .15em; }
  .warn:empty, .warn.off { display: none; }

  .hint { margin-top: .5em; font-size: .78em; color: var(--dim); letter-spacing: .04em; transition: opacity 1.2s ease; }
  .hint.fade { opacity: 0; }
  .hint kbd { font-family: inherit; font-weight: 700; color: var(--ink); }

  /* Controls: hidden until the mouse is over the tracker. */
  .ctl { display: flex; align-items: center; gap: .3em; margin-top: .45em; opacity: 0; pointer-events: none;
    transition: opacity .15s steps(3); font-size: .8em; }
  #tracker:hover .ctl, #tracker.pin .ctl { opacity: 1; pointer-events: auto; }
  #tracker.collapsed .ctl { margin-top: .25em; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 1.9em; height: 1.9em; border-radius: .3em;
    background: rgba(16,12,28,.85); border: 1px solid rgba(255,255,255,.14); color: var(--ink); cursor: pointer; text-shadow: none; }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn.on { border-color: var(--accent); background: var(--accent); color: #16101f; }
  .btn svg { width: 1.05em; height: 1.05em; }
  .btn.aa { font-weight: 800; font-size: .95em; letter-spacing: -.02em; width: auto; padding: 0 .5em; }
  .sl { display: inline-flex; align-items: center; gap: .3em; background: rgba(16,12,28,.85); border: 1px solid rgba(255,255,255,.14);
    border-radius: .3em; height: 1.9em; padding: 0 .5em; }
  .sl svg { width: 1em; height: 1em; opacity: .8; }
  input[type=range] { width: 5.5em; accent-color: var(--accent); cursor: pointer; margin: 0; }

  /* Sent away: a ribbon bookmark in the accent colour sticking out of the screen edge, with a swallowtail notch at its
     free end, the logo and the uncollected count. It's anchored to the edge, so hovering lengthens it (it slides a
     little further out, in steps); the window keeps room for that. Pixel look: hard 2 px light and shade lines. */
  #tab { position: absolute; top: 3px; right: 0; display: none; cursor: pointer; opacity: var(--alpha);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 3px 5px rgba(0,0,0,.45)); }
  #tab.left { right: auto; left: 0; }
  body.away #tab { display: block; }
  #tab .rib { position: relative; display: flex; align-items: center; gap: .35em; height: 1.9em; box-sizing: border-box;
    padding: 0 .5em 0 1.2em; background: var(--accent); image-rendering: pixelated;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -2px 0 rgba(0,0,0,.32);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, .65em 50%); transition: padding .12s steps(2); }
  #tab.left .rib { flex-direction: row-reverse; padding: 0 1.2em 0 .5em;
    clip-path: polygon(0 0, 100% 0, calc(100% - .65em) 50%, 100% 100%, 0 100%); }
  #tab.right:hover .rib { padding-left: 1.75em; }
  #tab.left:hover .rib { padding-right: 1.75em; }
  /* Stitching along the ribbon, one pixel in from the light and shade lines. */
  #tab .rib::before { content: ''; position: absolute; left: .95em; right: .2em; top: 4px; bottom: 4px;
    border-top: 1px dashed rgba(22,16,31,.35); border-bottom: 1px dashed rgba(22,16,31,.35); pointer-events: none; }
  #tab.left .rib::before { left: .2em; right: .95em; }
  #tab svg.logo { width: 16px; height: 16px; image-rendering: pixelated; flex-shrink: 0; position: relative; }
  #tab .n { position: relative; min-width: 1.35em; height: 1.35em; padding: 0 .25em; box-sizing: border-box; border-radius: 2px;
    background: #16101f; color: var(--ink); font-size: .72em; font-weight: 800; display: flex; align-items: center;
    justify-content: center; text-shadow: none; }

  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: var(--alpha); transform: none; } }
  #tracker.in { animation: pop .25s steps(3) both; }
  body.demo #demo { position: fixed; right: 12px; bottom: 12px; font: 12px/1.4 'Segoe UI', system-ui; color: #fff; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 6px; }
  body:not(.demo) #demo { display: none; }
</style>
</head>
<body>
<div id="tracker" class="in">
  <div class="head" id="head">
    <span class="tg" id="fold" title="Click: fold or open. Drag: move."><span class="title" id="title">Objectives</span><span class="count" id="count"></span><span class="chev" id="headChev">▾</span></span>
    <span class="book" id="bBook" title="Open the Compendium"><svg viewBox="0 0 16 12" shape-rendering="crispEdges"><path fill="currentColor" d="M1 1h5v1h1v9H6v-1H1zM15 1h-5v1H9v9h1v-1h5z"/><path fill="#16101f" d="M2 3h3v1H2zM2 5h3v1H2zM2 7h3v1H2zM11 3h3v1h-3zM11 5h3v1h-3zM11 7h3v1h-3z"/></svg></span>
  </div>
  <div class="place" id="place">
    <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
    <span class="arr off" id="prevArea">‹</span>
    <span class="ptxt"><span class="name" id="placeName"></span><span class="loc" id="bLocate" title="Locate me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg><span class="ll" id="locLbl">Locate me</span></span><span class="story" id="placeStory"></span></span>
    <span class="arr off" id="nextArea">›</span>
    <span class="tick">✓</span>
    <span class="confirm" id="placeConfirm">Confirm</span>
  </div>
  <div class="arealist off" id="areaList"></div>
  <div class="source" id="source"></div>
  <div class="quest" id="quest"></div>
  <div class="body" id="body">
    <div id="secs"></div>
    <div class="none" id="none"></div>
  </div>
  <div class="next off" id="next"><span id="nextLbl"></span></div>
  <div class="notice" id="notice"></div>
  <div class="warn off" id="warn"></div>
  <div class="hint" id="hint"><kbd>Ctrl+G</kbd> or click the title: open the Compendium</div>
  <div class="ctl" id="ctl">
    <span class="btn" id="bConfirm" title="Confirm where you are"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></span>
    <span class="btn" id="bAway" title="Send to the screen edge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h12"/><path d="m13 6 6 6-6 6"/><path d="M21 4v16"/></svg></span>
    <span class="btn aa" id="bSize" title="Text size">Aa</span>
    <span class="sl" id="alphaWrap" title="Transparency"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg><input type="range" id="alpha" min="30" max="100" value="100"></span>
    <span class="sl" id="bdWrap" title="Backdrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18" opacity=".5"/></svg><input type="range" id="bd" min="0" max="95" value="45"></span>
  </div>
</div>

<div id="demo">demo: <b>1/2/3</b> state · <b>G</b> peek · <b>L</b> locating · drag the header to move · <b>B</b> backdrop · <b>T</b> text size · click items/place</div>

<script>
  'use strict';
  // Talks to the desktop app through window.qcTracker (electron/trackerPreload.cjs). Standalone in a browser
  // (?demo=1) it runs with sample data so the look can be checked without the app.
  const bridge = window.qcTracker || null;
  const demo = !bridge || /[?&]demo=1/.test(location.search);
  const $ = (id) => document.getElementById(id);
  const tracker = $('tracker'), tab = $('tab'), secs = $('secs'), hint = $('hint');
  const SHOW = 12; // entries per section before "+N more"
  const SIZES = { small: 14, medium: 16, large: 19 };
  const PEEK_MS = 7000;

  // What's on screen right now and how the player set it up (settings come from the app, per game).
  const state = {
    data: null,                   // { id, quest, place:{name,story,sure}, sections:[{id,title,tone,icon,items:[…]}], next, warning, accent }
    collapsed: {},                // sections folded by their heading (saved per game by the app)
    more: {},                     // sections opened past SHOW entries ("+N more"), until the next place
    maxHeight: 0,                 // the tallest the tracker may grow, in px (70% of the screen)
    view: 'full',                 // full | collapsed | away
    peekFrom: null,               // the view to fold back to after a peek
    size: 'medium', alpha: 100, backdrop: 45, edge: 'right', // backdrop: 0 (off) to 95 (% darkness)
    hidden: [],                   // entries hidden with their × (saved per game by the app)
    limits: {},                   // entries shown per section: 3, 6 or 0 = all (saved per game); unset = SHOW
    areaOpen: false,              // the guide's area list is open
    openItem: null,               // the entry whose details are open (one at a time), until the next place
    scale: 1,                     // the app's UI scale (Settings), applied on top of the text size
    keys: 'Ctrl+Space',           // the show/hide shortcut as shown ('' = none)
  };
  let peekTimer = null, hintTimer = null;

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const send = (type, payload) => { if (bridge) bridge.send({ type, ...payload }); else console.log('[tracker]', type, payload || ''); };
  // The page's words, in the app's language (payload.labels), with English as the fallback.
  const EN = {
    title: 'Objectives', confirm: 'Confirm', missable: 'Missable: {list}', placeHint: 'Click to confirm this is where you are',
    confirmHint: 'Confirm where you are', away: 'Send to the screen edge',
    size: 'Text size', alpha: 'Transparency', backdrop: 'Soft dark backdrop', tabHint: 'Bring the objectives back',
    itemTodo: 'Click: collected', itemDone: 'Click: not collected yet',
    empty: 'Nothing to track here yet', secAnswer: 'From your last answer', secMissable: 'Missable here',
    secNoReturn: 'Point of no return', secCollect: 'To collect', secAch: 'Achievements here', more: '+{n} more',
    next: 'Next: {area}', closest: 'From the guide: {area} (closest match)', showHidden: 'Show {n} hidden', hideEntry: 'Hide',
    limitHint: 'Click: show 3, 6 or all', prevArea: 'Previous area', nextArea: 'Next area', areaList: 'All areas in the guide',
    locate: 'Locate me', locating: 'Locating…',
    hintBook: '{keys} or the book icon: open the Compendium', hintBookNoKeys: 'The book icon opens the Compendium',
    headFold: 'Click: fold the log to this line or open it. Drag: move.', openBook: 'Open the Compendium',
    foldHint: 'Click to fold or open', detWhere: 'Where', detHow: 'How', detMissable: 'Missable', detNotes: 'Notes',
    openInGuide: 'Open in guide', askAbout: 'Ask about this', expandHint: 'Click for details',
  };
  const L = (k, vars) => {
    const own = state.data && state.data.labels && state.data.labels[k];
    let s = typeof own === 'string' && own.trim() ? own : EN[k];
    for (const [n, v] of Object.entries(vars || {})) s = s.split(`{${n}}`).join(v);
    return s;
  };
  function applyLabels() {
    $('title').textContent = L('title');
    $('placeConfirm').textContent = L('confirm');
    $('fold').title = L('headFold');
    $('bBook').title = L('openBook');
    $('locLbl').textContent = L('locate');
    $('placeConfirm').title = L('placeHint');
    $('prevArea').title = L('prevArea');
    $('nextArea').title = L('nextArea');
    $('placeName').title = state.data && state.data.areas ? L('areaList') : '';
    $('bConfirm').title = L('confirmHint');
    $('bAway').title = L('away');
    $('bSize').title = L('size');
    $('alphaWrap').title = L('alpha');
    $('bdWrap').title = L('backdrop');
    tab.title = L('tabHint');
    // The show/hide shortcut (state.keys), or a hint without one when none is registered.
    if (!state.keys) { $('hint').textContent = L('hintBookNoKeys'); return; }
    const [before, after] = L('hintBook').split('{keys}');
    $('hint').innerHTML = after === undefined ? esc(before) : `${esc(before)}<kbd>${esc(state.keys)}</kbd>${esc(after)}`;
  }

  const WARN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';

  /**
   * One line: the answer's markers get their number badge, guide entries a box, other lines (no return) none. Ticking
   * is on the badge or box only; clicking the text opens the entry's details below it (one at a time). Every line has a
   * × (on hover) that hides it.
   */
  function itemHtml(o, sectionId) {
    const open = state.openItem === o.id;
    const cls = [o.done ? 'done' : '', o.missable ? 'miss' : '', sectionId === 'noreturn' ? 'info' : '', !o.tick && sectionId !== 'noreturn' ? 'static' : '', open ? 'open' : ''].filter(Boolean).join(' ');
    const tickTitle = o.tick ? ` title="${esc(o.done ? L('itemDone') : L('itemTodo'))}"` : '';
    const tk = o.tick ? ' tk' : '';
    const mark = o.badge ? `<span class="badge${tk}"${tickTitle}>${o.done ? '✓' : o.badge}</span>`
      : sectionId === 'noreturn' ? ''
      : `<span class="box${tk}"${tickTitle}>${o.done ? '✓' : ''}</span>`;
    const where = o.where && !o.done ? ` <span class="where">— ${esc(o.where)}</span>` : '';
    return `<li class="${cls}" data-item="${esc(o.id)}">${mark}<span class="obj" title="${esc(L('expandHint'))}">${esc(o.label)}${where}<span class="ex">${open ? '▾' : '▸'}</span></span><span class="x" title="${esc(L('hideEntry'))}">×</span>${open ? detailHtml(o) : ''}</li>`;
  }

  /** An entry's details: its full text and everything the guide has (where, how, why it's missable, notes). */
  function detailHtml(o) {
    const d = o.detail || {};
    const row = (k, v, amber) => (v ? `<div class="dl"><span class="dk${amber ? ' amber' : ''}">${esc(L(k))}</span>${esc(v)}</div>` : '');
    const full = d.full && d.full !== o.label ? `<div class="dl">${esc(d.full)}</div>` : '';
    const where = d.where || o.where || '';
    // A missable entry says why when the guide does; otherwise the tag alone.
    const miss = o.missable || d.missable ? `<div class="dl"><span class="dk amber">${esc(L('detMissable'))}</span>${esc(d.missable || '')}</div>` : '';
    const guide = /^[ghn]:/.test(o.id) || !!(state.data && state.data.areas);
    const acts = `<div class="dacts">${guide ? `<span class="dbtn" data-act="open-entry">${esc(L('openInGuide'))}</span>` : ''}<span class="dbtn" data-act="ask-about">${esc(L('askAbout'))}</span></div>`;
    return `<div class="det">${full}${row('detWhere', where)}${row('detHow', d.how)}${miss}${row('detNotes', d.notes)}${acts}</div>`;
  }

  function render() {
    const d = state.data; if (!d) return;
    applyLabels();
    document.documentElement.style.setProperty('--accent', /^#[0-9a-f]{3,8}$/i.test(d.accent || '') ? d.accent : '#a87ffb');
    if (state.maxHeight > 0) document.documentElement.style.setProperty('--maxh', `${state.maxHeight}px`);
    // Hidden entries (their ×) leave the lists and the counts; each section can bring its own back.
    const hidden = new Set(state.hidden || []);
    const sections = (d.sections || []).map((x) => ({
      ...x,
      items: x.items.filter((o) => !hidden.has(o.id)),
      hiddenIds: x.items.filter((o) => hidden.has(o.id)).map((o) => o.id),
    }));
    // The header count and the away tab's number: what's left to tick.
    const ticks = sections.flatMap((x) => x.items).filter((o) => o.tick);
    const done = ticks.filter((o) => o.done).length;
    $('count').textContent = ticks.length ? `${done}/${ticks.length}` : '';
    $('tabN').textContent = ticks.length ? `${ticks.length - done}` : '';
    $('tabN').style.display = ticks.length - done > 0 ? '' : 'none';
    // The guide area is the closest match for the place (not one of its areas by name): say so under the place.
    $('source').textContent = d.source || '';
    $('quest').textContent = d.quest || '';
    $('quest').style.display = d.quest ? '' : 'none';
    const p = d.place || null;
    $('place').style.display = p && p.name ? '' : 'none';
    // While locating, the place line says only "Locating…" (the rest of the log stays as it was until the result).
    $('place').classList.toggle('locating', !!d.locating);
    if (p) {
      $('placeName').textContent = d.locating ? L('locating') : p.name || '';
      $('placeStory').textContent = p.story && !d.locating ? ` · ${p.story}` : '';
      $('place').classList.toggle('sure', !!p.sure);
      $('bConfirm').classList.toggle('on', !!p.sure);
    }
    // ‹ › and the area list, from the guide's area order (disabled at the ends).
    const ar = d.areas && Array.isArray(d.areas.names) && d.areas.names.length ? d.areas : null;
    $('prevArea').classList.toggle('off', !ar);
    $('nextArea').classList.toggle('off', !ar);
    $('placeName').classList.toggle('pick', !!ar);
    if (ar) {
      $('prevArea').classList.toggle('dis', ar.index <= 0);
      $('nextArea').classList.toggle('dis', ar.index >= ar.names.length - 1);
    }
    const list = $('areaList');
    list.classList.toggle('off', !(ar && state.areaOpen));
    if (ar && state.areaOpen) {
      list.innerHTML = ar.names.map((n, i) => `<div class="ai${i === ar.index ? ' cur' : ''}" data-i="${i}">${esc(n)}</div>`).join('');
      const cur = list.querySelector('.cur');
      if (cur) cur.scrollIntoView({ block: 'nearest' });
    }
    secs.innerHTML = sections.map((x) => {
      const folded = !!state.collapsed[x.id];
      // The section's limit (its count cycles 3 / 6 / all; unset = SHOW), and "+N more" past it.
      const limit = state.limits && state.limits[x.id];
      const max = limit === 0 ? Infinity : limit || SHOW;
      const shown = state.more[x.id] ? x.items : x.items.slice(0, max);
      const left = x.items.length - shown.length;
      const tickable = x.items.filter((o) => o.tick);
      const n = tickable.length ? `${tickable.filter((o) => o.done).length}/${tickable.length}` : `${x.items.length}`;
      const cnt = `<span class="cnt" title="${esc(L('limitHint'))}">${n}</span>`;
      return `<div class="sec${x.tone === 'amber' ? ' amber' : ''}${folded ? ' folded' : ''}" data-sec="${esc(x.id)}">
        <div class="sechead" title="${esc(L('foldHint'))}">${x.icon === 'warn' ? WARN_ICON : ''}<span>${esc(x.title)}</span>${cnt}<span class="chev">${folded ? '▸' : '▾'}</span></div>
        <ol>${shown.map((o) => itemHtml(o, x.id)).join('')}</ol>
        ${left > 0 ? `<div class="more">${esc(L('more', { n: left }))}</div>` : ''}
        ${x.hiddenIds.length ? `<div class="unhide">${esc(L('showHidden', { n: x.hiddenIds.length }))}</div>` : ''}
      </div>`;
    }).join('');
    // Nothing at all to list here: one muted line.
    $('none').textContent = sections.length ? '' : L('empty');
    $('none').style.display = sections.length ? 'none' : '';
    // "Next: <area>", a muted line (the ‹ › arrows move there).
    const nx = d.next && d.next.name;
    $('next').classList.toggle('off', !nx);
    if (nx) {
      const [before, after] = L('next').split('{area}');
      $('nextLbl').innerHTML = after === undefined ? esc(before) : `${esc(before)}<span class="nm">${esc(nx)}</span>${esc(after)}`;
    }
    $('notice').textContent = d.notice || '';
    $('bLocate').classList.toggle('busy', !!d.locating);
    $('bLocate').title = d.locating ? L('locating') : L('locate');
    $('locLbl').textContent = d.locating ? L('locating') : L('locate');
    const warnText = d.warning || '';
    $('warn').classList.toggle('off', !warnText);
    $('warn').innerHTML = warnText ? `${WARN_ICON}<span>${esc(warnText)}</span>` : '';
    applyView();
  }

  function applyView() {
    const scale = Number.isFinite(state.scale) && state.scale > 0 ? state.scale : 1;
    document.documentElement.style.setProperty('--scale', String(scale));
    document.documentElement.style.setProperty('--fs', `calc(${SIZES[state.size] || 16}px * var(--scale))`);
    document.documentElement.style.setProperty('--alpha', String(state.alpha / 100));
    $('alpha').value = state.alpha;
    const bd = Number.isFinite(state.backdrop) ? Math.max(0, Math.min(95, state.backdrop)) : 45;
    tracker.classList.toggle('backdrop', bd > 0);
    document.documentElement.style.setProperty('--bd', String(bd / 100));
    $('bd').value = bd;
    $('bSize').textContent = state.size === 'small' ? 'aa' : state.size === 'large' ? 'AA' : 'Aa';
    tracker.classList.toggle('collapsed', state.view === 'collapsed');
    tracker.classList.toggle('away', state.view === 'away');
    document.body.classList.toggle('away', state.view === 'away');
    tab.className = state.edge === 'left' ? 'left' : 'right';
    $('headChev').textContent = state.view === 'collapsed' ? '▸' : '▾';
    reportSize();
  }

  // The app sizes the window to the content, so a transparent window never sits over the game needlessly.
  let lastSize = '';
  function reportSize() {
    requestAnimationFrame(() => {
      let w, h;
      if (state.view === 'away') {
        // The ribbon sits flush against the screen edge (the app puts the window there); the window keeps room for it
        // to lengthen on hover (.55em), measured from its resting length so hovering never resizes the window.
        const em = parseFloat(getComputedStyle(tab).fontSize) || 16;
        const grow = Math.ceil(em * 0.55);
        const rest = tab.offsetWidth - (tab.matches(':hover') ? grow : 0);
        w = rest + grow + 2;
        h = Math.ceil(tab.getBoundingClientRect().bottom + 6);
      } else {
        const r = tracker.getBoundingClientRect();
        w = Math.ceil(r.right + 6); h = Math.ceil(r.bottom + 6);
      }
      const key = `${w}x${h}:${state.view}`;
      if (key === lastSize) return;
      lastSize = key;
      send('size', { width: w, height: h, view: state.view, hasData: !!state.data });
    });
  }

  function setView(view, opts = {}) {
    if (!opts.peek) { clearTimeout(peekTimer); state.peekFrom = null; }
    state.view = view;
    tracker.classList.remove('in'); void tracker.offsetWidth; tracker.classList.add('in');
    applyView();
    if (!opts.peek) send('view', { view });
  }

  // Ctrl+G or clicking the header: open the full tracker where it is, then fold back to how it was.
  function peek() {
    if (state.view === 'full' && !state.peekFrom) { setView('collapsed'); return; }
    if (!state.peekFrom) state.peekFrom = state.view;
    setView('full', { peek: true });
    send('peek', { from: state.peekFrom });
    armFold();
  }
  function armFold() {
    clearTimeout(peekTimer);
    if (!state.peekFrom) return;
    peekTimer = setTimeout(() => {
      if (tracker.matches(':hover')) { armFold(); return; } // still being looked at: wait
      const back = state.peekFrom; state.peekFrom = null;
      setView(back, { peek: true });
    }, PEEK_MS);
  }

  function showHint() {
    clearTimeout(hintTimer);
    hint.classList.remove('fade');
    hintTimer = setTimeout(() => hint.classList.add('fade'), 4000);
  }

  // Header: the book opens the panel here, a click anywhere else folds the whole log to the header line (and back), and
  // a drag moves the whole tracker. (The press target is kept: under pointer capture the release reports the header.)
  let drag = null;
  $('head').addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    drag = { x: e.screenX, y: e.screenY, moved: false, book: !!e.target.closest('#bBook') };
    $('head').setPointerCapture(e.pointerId);
  });
  $('head').addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true; drag.x = e.screenX; drag.y = e.screenY;
    if (demo) { // no app to move the window: move the tracker inside the page instead
      tracker.style.left = `${Math.max(0, tracker.offsetLeft + dx)}px`; tracker.style.top = `${Math.max(0, tracker.offsetTop + dy)}px`;
      return;
    }
    send('drag', { dx, dy });
  });
  $('head').addEventListener('pointerup', (e) => {
    const was = drag; drag = null;
    if (!was) return;
    if (was.moved) send('drag-end', {});
    else if (was.book) send('open-panel', {});
    else setView(state.view === 'collapsed' ? 'full' : 'collapsed');
  });
  $('head').addEventListener('pointercancel', () => { drag = null; });

  // A press or drag must never stay stuck (it would keep the app thinking the mouse is held): let go of it when new
  // data arrives, when the window hides or loses focus, and when the header loses its pointer capture.
  function releasePress() {
    drag = null;
    send('press', { down: false });
  }
  $('head').addEventListener('lostpointercapture', releasePress);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releasePress(); });
  window.addEventListener('blur', releasePress);

  secs.addEventListener('click', (e) => {
    const sec = e.target.closest('.sec'); if (!sec || !state.data) return;
    const id = sec.dataset.sec;
    const x = (state.data.sections || []).find((s2) => s2.id === id);
    if (e.target.closest('.cnt')) {
      // The count: show 3, then 6, then all (remembered per game by the app).
      const cur = state.limits && state.limits[id];
      const next = cur === 3 ? 6 : cur === 6 ? 0 : 3;
      state.limits = { ...(state.limits || {}), [id]: next };
      state.more = { ...state.more, [id]: false };
      render();
      send('limit', { section: id, limit: next });
      return;
    }
    if (e.target.closest('.sechead')) {
      // Fold or open the section (remembered per game by the app).
      state.collapsed = { ...state.collapsed, [id]: !state.collapsed[id] };
      if (!state.collapsed[id]) delete state.collapsed[id];
      render();
      send('section', { id, collapsed: !!state.collapsed[id] });
      return;
    }
    if (e.target.closest('.more')) { state.more = { ...state.more, [id]: true }; render(); return; }
    if (e.target.closest('.unhide')) {
      // "Show N hidden": this section's hidden entries come back.
      const ids = (x ? x.items : []).map((o) => o.id).filter((oid) => (state.hidden || []).includes(oid));
      state.hidden = (state.hidden || []).filter((oid) => !ids.includes(oid));
      render();
      send('hide-item', { ids, hidden: false });
      return;
    }
    const li = e.target.closest('li'); if (!li) return;
    const o = x && x.items.find((it) => it.id === li.dataset.item);
    if (!o) return;
    if (e.target.closest('.x')) {
      // The ×: hide this entry (remembered per game, and per area through the entry's id).
      state.hidden = [...(state.hidden || []), o.id];
      render();
      send('hide-item', { id: o.id, hidden: true });
      return;
    }
    // The details' buttons: show the entry in the guide, or put a question about it in the panel's question box.
    const act = e.target.closest('.dbtn');
    if (act) { send(act.dataset.act, { item: o.id }); return; }
    if (e.target.closest('.det')) return;
    // Ticking: the square box or the number badge only.
    if (e.target.closest('.badge, .box')) {
      if (!o.tick) return;
      o.done = !o.done; render();
      send('tick', { item: o.id, done: o.done });
      return;
    }
    // The text: open its details in place (one at a time), or close them.
    if (e.target.closest('.obj')) {
      state.openItem = state.openItem === o.id ? null : o.id;
      render();
    }
  });
  // Area navigation: ‹ ›, and the name opens the guide's area list (current one highlighted).
  const gotoArea = (i) => {
    const ar = state.data && state.data.areas;
    if (!ar || i < 0 || i >= ar.names.length || i === ar.index) return;
    state.areaOpen = false;
    send('goto-area', { name: ar.names[i] });
  };
  $('prevArea').addEventListener('click', () => { const ar = state.data && state.data.areas; if (ar) gotoArea(ar.index - 1); });
  $('nextArea').addEventListener('click', () => { const ar = state.data && state.data.areas; if (ar) gotoArea(ar.index + 1); });
  $('placeName').addEventListener('click', () => {
    if (!state.data || !state.data.areas) return;
    state.areaOpen = !state.areaOpen;
    render();
  });
  $('areaList').addEventListener('click', (e) => {
    const it = e.target.closest('.ai'); if (!it) return;
    gotoArea(Number(it.dataset.i));
  });
  // "Locate me" (the crosshair after the place name): the app takes a screenshot and finds the area; meanwhile the
  // crosshair spins and the place line says "Locating…".
  $('bLocate').addEventListener('click', () => { if (state.data && !state.data.locating) send('locate', {}); });
  const confirmPlace = () => {
    const p = state.data && state.data.place; if (!p || !p.name) return;
    p.sure = true; render();
    send('confirm-place', { id: state.data.id, name: p.name, story: p.story || '' });
  };
  $('placeConfirm').addEventListener('click', confirmPlace);
  $('bConfirm').addEventListener('click', confirmPlace);
  $('bAway').addEventListener('click', () => setView('away'));
  tab.addEventListener('click', () => setView('full'));
  $('bSize').addEventListener('click', () => {
    state.size = state.size === 'small' ? 'medium' : state.size === 'medium' ? 'large' : 'small';
    applyView(); send('settings', { size: state.size });
  });
  $('alpha').addEventListener('input', () => { state.alpha = Number($('alpha').value); applyView(); });
  $('alpha').addEventListener('change', () => send('settings', { alpha: state.alpha }));
  $('bd').addEventListener('input', () => { state.backdrop = Number($('bd').value); applyView(); });
  $('bd').addEventListener('change', () => send('settings', { backdrop: state.backdrop }));

  // Click-through is handled by the app (it hit-tests the cursor against this window). A press tells it to keep clicks
  // on until the press ends, so dragging the header or the transparency slider can leave the window.
  tracker.addEventListener('mouseleave', () => { if (state.peekFrom) armFold(); });
  document.addEventListener('pointerdown', () => send('press', { down: true }));
  document.addEventListener('pointerup', () => send('press', { down: false }));
  document.addEventListener('pointercancel', () => send('press', { down: false }));

  // Called by the app.
  window.qcTrackerShow = (data, settings) => {
    releasePress();
    if (settings && typeof settings.backdrop === 'boolean') settings.backdrop = settings.backdrop ? 45 : 0;
    const samePlace = state.data && data && state.data.place && data.place && state.data.place.name === data.place.name;
    if (!samePlace) { state.more = {}; state.areaOpen = false; state.openItem = null; }
    state.data = data;
    if (settings) Object.assign(state, settings);
    if (settings && settings.view) state.view = settings.view;
    render(); showHint();
  };
  window.qcTrackerUpdate = (patch) => { if (state.data) Object.assign(state.data, patch); render(); };
  window.qcTrackerSettings = (s) => {
    Object.assign(state, s);
    if (s && 'scale' in s) lastSize = ''; // a new UI scale: always report the new size to the app
    if (s && 'keys' in s && state.data) applyLabels();
    applyView();
  };
  window.qcTrackerPeek = peek;
  window.qcTrackerEdge = (edge) => { state.edge = edge; applyView(); };
  window.addEventListener('resize', reportSize);

  if (demo) {
    document.body.classList.add('demo');
    tracker.style.left = `${Math.max(8, window.innerWidth - 440)}px`; tracker.style.top = '24px'; // top-right by default
    window.qcTrackerShow({
      id: 'demo', accent: '#a87ffb', quest: 'Find the Elder Scroll in the Dwemer ruins',
      place: { name: 'Blackreach', story: 'Just after meeting Septimus', sure: false },
      sections: [
        { id: 'answer', title: 'From your last answer', items: [
          { id: 'a:d:0', label: 'Crimson Nirnroot', where: 'by the glowing mushrooms, left of the lift', badge: 1, tick: true },
          { id: 'a:d:1', label: 'Falmer sword', where: 'on the dead Falmer near the bridge', done: true, badge: 2, tick: true },
        ] },
        { id: 'missable', title: 'Missable here', tone: 'amber', items: [
          { id: 'g:b:1', label: 'Attunement sphere', where: 'top of the stairs', missable: true, tick: true,
            detail: { where: 'Top of the stairs in the Tower of Mzark, on the lens control pedestal', how: 'Bring the Elder Scroll and the Lexicon from Septimus Signus', missable: 'The tower seals once you read the Elder Scroll', notes: "Pick up Auriel's Bow in the Chantry afterwards." } },
        ] },
        { id: 'noreturn', title: 'Point of no return', tone: 'amber', icon: 'warn', items: [
          { id: 'n:0', label: 'Reading the Elder Scroll', where: 'the Tower of Mzark closes' },
        ] },
        { id: 'collect', title: 'To collect', items: Array.from({ length: 16 }, (_, i) => ({ id: 'g:b:c' + i, label: 'Crimson Nirnroot #' + (i + 1), tick: true, done: i < 3 })) },
        { id: 'ach', title: 'Achievements here', items: [{ id: 'h:0:x', label: 'Elder Knowledge', where: 'read the scroll at the Tower of Mzark' }] },
      ],
      next: { name: 'Tower of Mzark' },
    }, { maxHeight: Math.round(window.innerHeight * 0.7) });
    document.addEventListener('keydown', (e) => {
      if (e.key === '1') setView('full'); if (e.key === '2') setView('collapsed'); if (e.key === '3') setView('away');
      if (e.key.toLowerCase() === 'g') peek();
      if (e.key.toLowerCase() === 'l') window.qcTrackerUpdate({ locating: !state.data.locating });
      if (e.key.toLowerCase() === 'b') { state.backdrop = state.backdrop >= 90 ? 0 : state.backdrop + 30; applyView(); }
      if (e.key.toLowerCase() === 't') $('bSize').click();
    });
  }
</script>
</body>
</html>
