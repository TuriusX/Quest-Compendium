<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium</title>
<style>
  /* The tuck-away tab outside the open panel's frame (electron/edgetab.cjs): 12 px of the theme's accent with a pixel
     arrow pointing at the screen edge the panel tucks into. Hovering slides it 6 px further out. ?edge=left|right (the
     dock side), &accent=#hex, &label=… */
  :root { --accent: #a87ffb; --w: 12px; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  /* Docked right: the tab hangs off the panel's left edge, so it's flush with this window's right side. */
  #tab { position: absolute; top: 0; bottom: 0; right: 0; width: var(--w); cursor: pointer; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; background: #16101f; color: var(--accent);
    border: 2px solid var(--accent); border-right: 0; border-radius: 4px 0 0 4px; transition: width .12s steps(3); }
  body.left #tab { right: auto; left: 0; border-right: 2px solid var(--accent); border-left: 0; border-radius: 0 4px 4px 0; }
  #tab:hover { width: calc(var(--w) + 6px); background: var(--accent); color: #16101f; }
  svg { width: 6px; height: 10px; image-rendering: pixelated; }
  body.left svg { transform: scaleX(-1); }
</style>
</head>
<body>
<div id="tab" title="Tuck the panel away" role="button" aria-label="Tuck the panel away">
  <svg viewBox="0 0 6 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 0h2v2h2v2h2v2H4v2H2v2H0V8h2V6h2V4H2V2H0z"/></svg>
</div>
<script>
  'use strict';
  const q = new URLSearchParams(location.search);
  if (q.get('edge') === 'left') document.body.classList.add('left');
  const accent = q.get('accent') || '';
  if (/^#[0-9a-f]{3,8}$/i.test(accent)) document.documentElement.style.setProperty('--accent', accent);
  const label = q.get('label');
  const tab = document.getElementById('tab');
  if (label) { tab.title = label; tab.setAttribute('aria-label', label); }
  // The spine's preload: "open" here means the tab was clicked (the app tucks the panel away).
  tab.addEventListener('click', () => { if (window.qcSpine) window.qcSpine.open(); });
</script>
</body>
</html>
