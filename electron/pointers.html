<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium markers</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
  /* A marker frames the item with pixel corner brackets and floats a numbered label above it, so the item itself
     stays visible (and the sticky tracker can keep checking it). */
  .m { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .2s steps(3); }
  .m.hidden { opacity: 0; }
  .inner { position: relative; animation: pop .25s steps(3) both; }
  .frame { position: absolute; left: -32px; top: -32px; width: 64px; height: 64px; animation: pulse 1.2s steps(2) infinite; }
  .c { position: absolute; width: 16px; height: 16px; border: 0 solid var(--accent); filter: drop-shadow(0 0 1px #16101f) drop-shadow(0 0 1px #16101f); }
  .c.tl { left: 0; top: 0; border-top-width: 4px; border-left-width: 4px; }
  .c.tr { right: 0; top: 0; border-top-width: 4px; border-right-width: 4px; }
  .c.bl { left: 0; bottom: 0; border-bottom-width: 4px; border-left-width: 4px; }
  .c.br { right: 0; bottom: 0; border-bottom-width: 4px; border-right-width: 4px; }
  .tag { position: absolute; left: 0; bottom: 42px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; white-space: nowrap;
         background: rgba(16, 12, 28, .94); border: 2px solid var(--accent); padding: 3px 12px 3px 3px; color: #fff;
         font-size: 16px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 0, 0, .6); }
  .num { width: 24px; height: 24px; background: var(--accent); color: #16101f; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .tag::after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--accent); }
  .below .tag { bottom: auto; top: 42px; }
  .below .tag::after { bottom: auto; top: -9px; border-top: 0; border-bottom: 7px solid var(--accent); }
  body.out .m { opacity: 0; transition: opacity .3s steps(3); }
  .toast { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); padding: 8px 16px; background: rgba(16, 12, 28, .95);
           border: 2px solid var(--accent); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 0, 0, .6);
           animation: pop .25s steps(3) both; white-space: nowrap; }
  .toast b { color: var(--accent); }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<script src="pointerTracker.js"></script>
<script>
  // Started by the desktop app with the markers to draw. In sticky mode the markers follow the things they point at
  // while the game scrolls (see pointerTracker.js); otherwise they simply stay for a few seconds.
  'use strict';
  const WORK_W = 384; // tracking resolution: small on purpose (fast, and plenty for finding a barrel)
  const CHECK_NEW_AREA = 0.33; // ask about nearby items again once this much of the screen is new
  let finished = false;
  let stream = null;
  let hidden = new Set(); // markers the player switched off in the answer's list
  let live = null; // sticky-mode state, so markers can be added while tracking
  let pendingAdds = []; // found items that arrived before tracking started

  function finish() {
    if (finished) return;
    finished = true;
    document.body.classList.add('out');
    try { stream && stream.getTracks().forEach((t) => t.stop()); } catch (_) {}
    setTimeout(() => window.close(), 350);
  }

  function place(el, x, y) {
    el.style.transform = `translate(${Math.round(x * window.innerWidth)}px, ${Math.round(y * window.innerHeight)}px)`;
    el.classList.toggle('below', y < 0.12); // near the top edge the label goes under the item
  }

  const log = (...args) => console.log('[markers]', ...args);

  function buildMarkers(points, startIndex = 0) {
    return points.map((p, j) => {
      const i = startIndex + j;
      const el = document.createElement('div');
      el.className = 'm';
      const inner = document.createElement('div');
      inner.className = 'inner';
      const frame = document.createElement('div');
      frame.className = 'frame';
      for (const corner of ['tl', 'tr', 'bl', 'br']) {
        const c = document.createElement('div');
        c.className = `c ${corner}`;
        frame.append(c);
      }
      const tag = document.createElement('div');
      tag.className = 'tag';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(i + 1);
      const label = document.createElement('span');
      label.textContent = p.label || '';
      tag.append(num, label);
      inner.append(frame, tag);
      el.append(inner);
      document.body.append(el);
      place(el, p.x, p.y);
      return el;
    });
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function grayOf(ctx, source, w, h) {
    ctx.drawImage(source, 0, 0, w, h);
    return QCTracker.toGray(ctx.getImageData(0, 0, w, h).data, w, h);
  }

  async function startSticky(opts, els) {
    const ref = await loadImage(opts.refImage);
    const w = WORK_W;
    const h = Math.max(16, Math.round((WORK_W * ref.naturalHeight) / ref.naturalWidth));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tracker = QCTracker.createTracker({
      ref: grayOf(ctx, ref, w, h), w, h, points: opts.points, exclude: opts.exclude || [],
      selfVisible: !!opts.selfVisible, screenWidth: window.innerWidth,
    });

    // A live, low-resolution view of the screen.
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: opts.sourceId, maxWidth: 960, maxHeight: 960, maxFrameRate: 30 } },
    });
    const video = document.createElement('video');
    video.muted = true;
    video.srcObject = stream;
    await video.play();

    // Tracking runs 20 times a second; drawing runs every frame and glides toward the tracked spots,
    // predicting a little ahead with each marker's speed, so movement looks smooth rather than stepped.
    const target = opts.points.map((p) => ({ x: p.x, y: p.y }));
    const shown = opts.points.map((p) => ({ x: p.x, y: p.y }));
    const visible = opts.points.map(() => false);
    live = { tracker, ctx, w, h, els, target, shown, visible };
    // Found items that arrived while tracking was starting up (or that were found earlier and shown again).
    const queued = pendingAdds;
    pendingAdds = [];
    for (const add of queued) await window.qcAddPoints(add);
    let checkedAt = { x: 0, y: 0 };
    els.forEach((el) => el.classList.add('hidden')); // appear once they're in the right place

    let started = Date.now();
    live.restartTimer = () => { started = Date.now(); };
    live.opts = opts;
    let lastTrack = 0;
    const track = () => {
      if (finished) return;
      if (opts.lifetimeMs > 0 && Date.now() - started > opts.lifetimeMs) {
        log('display time is up: fading out');
        return finish();
      }
      const now = performance.now();
      if (video.readyState >= 2 && now - lastTrack >= 30) {
        lastTrack = now;
        const res = tracker.update(grayOf(ctx, video, w, h));
        for (let i = 0; i < res.length && i < els.length; i++) {
          const r = res[i];
          const becameVisible = r.visible && !visible[i];
          target[i].x = r.x;
          target[i].y = r.y;
          if (becameVisible) {
            shown[i].x = r.x; // snap into place instead of gliding in from somewhere else
            shown[i].y = r.y;
          }
          if (r.visible !== visible[i]) log(`marker ${i + 1} ${r.visible ? 'shown' : 'hidden'}`);
          visible[i] = r.visible;
          els[i].classList.toggle('hidden', !r.visible || hidden.has(i));
        }
        if (tracker.gone) {
          log('scene changed (or nothing left to track): fading out');
          return finish();
        }
        // Enough new screen since the last look? Ask the app to check for nearby items.
        const cam = tracker.camera;
        const dx = Math.abs(cam.x - checkedAt.x);
        const dy = Math.abs(cam.y - checkedAt.y);
        const newArea = 1 - Math.max(0, 1 - dx) * Math.max(0, 1 - dy);
        if (opts.watchMoves && window.qcBridge && newArea >= CHECK_NEW_AREA) {
          checkedAt = { x: cam.x, y: cam.y };
          live.checkCam = { x: cam.x, y: cam.y }; // the next found items were spotted from here
          log(`${Math.round(newArea * 100)}% of the screen is new: asking about nearby items`);
          window.qcBridge.moved();
        }
      }
      // Process each new frame of the screen as it arrives (about 30 a second).
      if (typeof video.requestVideoFrameCallback === 'function') video.requestVideoFrameCallback(track);
      else setTimeout(track, 33);
    };

    // Draw every screen refresh, gliding toward the tracked spots. No predicting ahead: markers never overshoot
    // when your character stops.
    let lastFrame = performance.now();
    const draw = (now) => {
      if (finished) return;
      const frameDt = Math.min(0.1, (now - lastFrame) / 1000);
      lastFrame = now;
      const k = 1 - Math.exp(-frameDt / 0.03);
      for (let i = 0; i < els.length; i++) {
        shown[i].x += (target[i].x - shown[i].x) * k;
        shown[i].y += (target[i].y - shown[i].y) * k;
        place(els[i], shown[i].x, shown[i].y);
      }
      requestAnimationFrame(draw);
    };
    track();
    requestAnimationFrame(draw);
  }

  /** Markers the player switched off (indexes into the answer's list). */
  window.qcSetHidden = (list) => {
    hidden = new Set(Array.isArray(list) ? list : []);
    document.querySelectorAll('.m').forEach((el, i) => {
      if (hidden.has(i)) el.classList.add('hidden');
      else if (!live) el.classList.remove('hidden');
    });
  };

  /** Items found as the player walked: add markers that track like the others. */
  window.qcAddPoints = async (add) => {
    const { points, refImage, startIndex } = add || {};
    if (finished || !Array.isArray(points) || !points.length || !refImage) return;
    if (!live) {
      pendingAdds.push(add);
      return;
    }
    const img = await loadImage(refImage);
    const { tracker, ctx, w, h, els, target, shown, visible } = live;
    // Items from an area check start where the camera movement since that screenshot puts them.
    const since = add.fromCheck ? live.checkCam : null;
    log(`adding ${points.length} found item(s) (${points.map((p) => p.label).join(', ')}), ${since ? 'placed from camera movement' : 'searching the screen'}`);
    tracker.addMarkers(grayOf(ctx, img, w, h), points, since);
    const added = buildMarkers(points, startIndex);
    if (add.fromCheck) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '✦ <b>Found nearby:</b> ';
      toast.append(document.createTextNode(points.map((p) => p.label).join(', ')));
      document.body.append(toast);
      setTimeout(() => toast.remove(), 4000);
    }
    added.forEach((el, j) => {
      el.classList.add('hidden');
      els.push(el);
      target.push({ x: points[j].x, y: points[j].y });
      shown.push({ x: points[j].x, y: points[j].y });
      visible.push(false);
    });
  };

  /** Precision pass: slide markers onto the exact object. */
  window.qcMovePoints = ({ moves }) => {
    if (!Array.isArray(moves) || !moves.length) return;
    log(`precision pass moved ${moves.length} marker(s)`);
    if (live) {
      live.tracker.moveMarkers(moves);
    } else {
      const els = document.querySelectorAll('.m');
      moves.forEach((mv) => els[mv.index] && place(els[mv.index], mv.x, mv.y));
    }
  };

  /** How long markers stay (0 = until hidden or the scene changes). Restarts the clock. */
  window.qcSetLifetime = (ms) => {
    if (live && live.opts) {
      live.opts.lifetimeMs = ms;
      live.restartTimer();
    }
    log(`display time set to ${ms ? Math.round(ms / 1000) + ' s' : 'always'}`);
  };

  window.qcStart = async (opts) => {
    log(`start: ${(opts.points || []).length} marker(s), sticky=${!!opts.sticky}, watching nearby=${!!opts.watchMoves}`);
    hidden = new Set(opts.hidden || []);
    if (Array.isArray(opts.extra)) pendingAdds.push(...opts.extra);
    document.documentElement.style.setProperty('--accent', opts.accent || '#a87ffb');
    const els = buildMarkers(opts.points || []);
    els.forEach((el, i) => hidden.has(i) && el.classList.add('hidden'));
    if (opts.sticky && opts.sourceId && opts.refImage && window.QCTracker) {
      try {
        await startSticky(opts, els);
        return;
      } catch (err) {
        log('sticky tracking unavailable, showing fixed markers:', err && err.message);
        els.forEach((el) => el.classList.remove('hidden'));
      }
    }
    setTimeout(finish, opts.fixedMs || 8000);
  };
</script>
</body>
</html>
