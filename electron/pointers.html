<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quest Compendium markers</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; }
  /* A marker is a numbered label floating just above the item, with a small arrow pointing down at it. Nothing
     covers the item itself, so it stays visible (and the sticky tracker can keep checking it). */
  .m { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity .2s steps(3); }
  .m.hidden { opacity: 0; }
  .inner { position: relative; animation: pop .25s steps(3) both; }
  .tag { position: absolute; left: 0; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; white-space: nowrap;
         background: rgba(16, 12, 28, .94); border: 2px solid var(--accent); padding: 3px 12px 3px 3px; color: #fff;
         font-size: 16px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 0, 0, .6); }
  .num { width: 24px; height: 24px; background: var(--accent); color: #16101f; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: flex-start; }
  /* Name on top (with a small icon for what kind of thing it is), the one-line note underneath, dimmer and shorter. */
  .txt { display: flex; flex-direction: column; min-width: 0; padding: 1px 0; }
  .name { display: flex; align-items: center; gap: 6px; line-height: 22px; }
  .ico { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent); }
  .note { font-size: 12.5px; font-weight: 500; line-height: 16px; color: rgba(236, 230, 255, .78); max-width: 300px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-bottom: 2px; }
  .tag::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -9px; border: 9px solid transparent; border-bottom: 0; border-top: 10px solid var(--accent); }
  .below .tag { bottom: auto; top: 22px; }
  .below .tag::after { bottom: auto; top: -12px; border-top: 0; border-bottom: 10px solid var(--accent); }
  body.out .m { opacity: 0; transition: opacity .3s steps(3); }
  /* One item picked in the answer's list: it grows and glows, the others step back. */
  .m.hl { z-index: 10; }
  .m.hl .tag { transform: translateX(-50%) scale(1.3); transform-origin: 50% 100%;
               box-shadow: 0 0 0 3px rgba(255, 255, 255, .85), 0 0 22px var(--accent), 0 6px 18px rgba(0, 0, 0, .6); }
  .below.hl .tag { transform-origin: 50% 0; }
  body.focus .m:not(.hl):not(.hidden) { opacity: .35; }
  .toast { position: absolute; left: 50%; top: 48px; transform: translateX(-50%); padding: 8px 16px; background: rgba(16, 12, 28, .95);
           border: 2px solid var(--accent); color: #fff; font-size: 17px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 0, 0, .6);
           animation: pop .25s steps(3) both; white-space: nowrap; }
  .toast b { color: var(--accent); }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
<script src="pointerTracker.js"></script>
<script>
  // Started by the desktop app with the markers to draw. In sticky mode the markers follow the things they point at
  // while the game scrolls (see pointerTracker.js); otherwise they simply stay for a few seconds.
  'use strict';
  const WORK_W = 384; // tracking resolution: small on purpose (fast, and plenty for finding a barrel)
  const CHECK_NEW_AREA = 0.33; // ask about nearby items again once this much of the screen is new
  let finished = false;
  let stream = null;
  let hidden = new Set(); // markers the player switched off in the answer's list
  let live = null; // sticky-mode state, so markers can be added while tracking
  let pendingAdds = []; // found items that arrived before tracking started

  function finish() {
    if (finished) return;
    finished = true;
    document.body.classList.add('out');
    try { stream && stream.getTracks().forEach((t) => t.stop()); } catch (_) {}
    setTimeout(() => window.close(), 350);
  }

  function place(el, x, y) {
    el.style.transform = `translate(${Math.round(x * window.innerWidth)}px, ${Math.round(y * window.innerHeight)}px)`;
    el.classList.toggle('below', y < 0.12); // near the top edge the label goes under the item
  }

  const log = (...args) => console.log('[markers]', ...args);

  // A small line icon per kind of thing (same set as the app's checklist).
  const ICONS = {
    weapon: '<path d="m11 19-6-6"/><path d="m5 21-2-2"/><path d="m8 16-4 4"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"/>',
    armor: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
    consumable: '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
    key: '<path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/>',
    quest: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
    lore: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    secret: '<path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/>',
    character: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    enemy: '<path d="m12.5 17-.5-1-.5 1h1z"/><path d="M15 22a1 1 0 0 0 1-1v-1a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20v1a1 1 0 0 0 1 1z"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="12" r="1"/>',
    danger: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    action: '<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
    place: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
    _: '<path d="M10.5 3 8 9l4 13 4-13-2.5-6"/><path d="M17 3a2 2 0 0 1 1.6.8l3 4a2 2 0 0 1 .013 2.382l-7.99 10.986a2 2 0 0 1-3.247 0l-7.99-10.986A2 2 0 0 1 2.4 7.8l2.998-3.997A2 2 0 0 1 7 3z"/><path d="M2 9h20"/>'
  };
  function icon(category) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2.4');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('class', 'ico');
    svg.innerHTML = ICONS[category] || ICONS._;
    return svg;
  }

  function buildMarkers(points, startIndex = 0) {
    return points.map((p, j) => {
      const i = startIndex + j;
      const el = document.createElement('div');
      el.className = 'm';
      const inner = document.createElement('div');
      inner.className = 'inner';
      const tag = document.createElement('div');
      tag.className = 'tag';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(i + 1);
      const txt = document.createElement('span');
      txt.className = 'txt';
      const name = document.createElement('span');
      name.className = 'name';
      const label = document.createElement('span');
      label.textContent = p.label || '';
      name.append(icon(p.category), label);
      txt.append(name);
      if (p.note) {
        const note = document.createElement('span');
        note.className = 'note';
        note.textContent = p.note;
        txt.append(note);
      }
      tag.append(num, txt);
      inner.append(tag);
      el.append(inner);
      document.body.append(el);
      place(el, p.x, p.y);
      return el;
    });
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function grayOf(ctx, source, w, h) {
    ctx.drawImage(source, 0, 0, w, h);
    return QCTracker.toGray(ctx.getImageData(0, 0, w, h).data, w, h);
  }

  async function startSticky(opts, els) {
    const ref = await loadImage(opts.refImage);
    const w = WORK_W;
    const h = Math.max(16, Math.round((WORK_W * ref.naturalHeight) / ref.naturalWidth));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tracker = QCTracker.createTracker({
      ref: grayOf(ctx, ref, w, h), w, h, points: opts.points, exclude: opts.exclude || [],
      selfVisible: !!opts.selfVisible, screenWidth: window.innerWidth,
    });

    // A live, low-resolution view of the screen.
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: opts.sourceId, maxWidth: 960, maxHeight: 960, maxFrameRate: 30 } },
    });
    const video = document.createElement('video');
    video.muted = true;
    video.srcObject = stream;
    await video.play();

    // Tracking runs 20 times a second; drawing runs every frame and glides toward the tracked spots,
    // predicting a little ahead with each marker's speed, so movement looks smooth rather than stepped.
    const target = opts.points.map((p) => ({ x: p.x, y: p.y }));
    const shown = opts.points.map((p) => ({ x: p.x, y: p.y }));
    // Where each marker is drawn before the motion lead: follows the tracked spot exactly while the camera moves,
    // but while it's still, small wobbles in the match are ignored and real corrections (like the precision pass)
    // glide into place instead of jumping.
    const calm = opts.points.map((p) => ({ x: p.x, y: p.y }));
    const DEAD_PX = 3; // corrections smaller than this, with the camera still, are ignored
    const GLIDE_MS = 110; // how quickly a marker settles onto a corrected spot
    let lastDraw = 0;
    const visible = opts.points.map(() => false);
    live = { tracker, ctx, w, h, els, target, shown, visible };
    // Found items that arrived while tracking was starting up (or that were found earlier and shown again).
    const queued = pendingAdds;
    pendingAdds = [];
    for (const add of queued) await window.qcAddPoints(add);
    let checkedAt = { x: 0, y: 0 };
    els.forEach((el) => el.classList.add('hidden')); // appear once they're in the right place

    // Watchdog: screen capture sends no frames while the screen sits still, so a scene change (like closing the game)
    // might be followed by nothing at all. If tracking failed and hasn't recovered within half a second, end.
    let lastTracked = performance.now();
    const watchdog = setInterval(() => {
      if (finished) return clearInterval(watchdog);
      if (tracker.lost && performance.now() - lastTracked > 500) {
        log('lost the scene and no new frames arrived: fading out');
        clearInterval(watchdog);
        finish();
      }
    }, 200);
    let started = Date.now();
    live.restartTimer = () => { started = Date.now(); };
    live.opts = opts;
    let lastTrack = 0;
    let lastAsk = 0;
    // Delay compensation (tuned on real FF6 footage): frames reach us a little late (screen capture), so while the
    // camera moves, markers are drawn slightly ahead along the camera's recent motion. Partial (70%) and capped, so
    // turning or stopping never throws them far; the instant the camera stops, prediction stops.
    const LEAD_SHARE = 0.7;
    const LEAD_CAP_PX = 25;
    const camHist = []; // { t (ms, capture time), x, y } in screen fractions
    let vel = { x: 0, y: 0 }; // camera speed, screen fractions per second
    let lastCaptureT = performance.now();
    let delaySum = 0;
    let delayN = 0;
    let framesDone = 0;
    let workMs = 0; // time spent reading and tracking frames since the last report
    let lastReport = performance.now();

    const track = (rafNow, meta) => {
      if (finished) return;
      if (opts.lifetimeMs > 0 && Date.now() - started > opts.lifetimeMs) {
        log('display time is up: fading out');
        return finish();
      }
      const now = performance.now();
      const moving = vel.x !== 0 || vel.y !== 0;
      // Game performance comes first: 30 frames a second while the screen moves, 15 while it's still.
      if (video.readyState >= 2 && now - lastTrack >= (moving ? 30 : 63)) {
        const gapMs = lastTrack ? now - lastTrack : 0; // screen capture skips frames while nothing changes
        lastTrack = now;
        const captureT = meta && typeof meta.captureTime === 'number' ? meta.captureTime : now - 45;
        if (meta && typeof meta.captureTime === 'number') {
          delaySum += now - meta.captureTime;
          delayN++;
        }
        const workStart = performance.now();
        const res = tracker.update(grayOf(ctx, video, w, h), gapMs);
        workMs += performance.now() - workStart;
        framesDone++;
        for (let i = 0; i < res.length && i < els.length; i++) {
          const r = res[i];
          target[i].x = r.x;
          target[i].y = r.y;
          if (r.visible !== visible[i]) log(`marker ${i + 1} ${r.visible ? 'shown' : 'hidden'}`);
          visible[i] = r.visible;
          els[i].classList.toggle('hidden', !r.visible || hidden.has(i));
        }
        if (tracker.gone) {
          log('scene changed (or nothing left to track): fading out');
          return finish();
        }
        if (!tracker.lost) lastTracked = now;
        // Camera speed over the last ~100 ms; zero as soon as it has been still for ~50 ms.
        const cam = tracker.camera;
        camHist.push({ t: captureT, x: cam.x, y: cam.y });
        while (camHist.length && captureT - camHist[0].t > 250) camHist.shift();
        const olderThan = (ms) => {
          let e = camHist[0];
          for (const c of camHist) if (captureT - c.t >= ms) e = c;
          return e;
        };
        const a = olderThan(100);
        const b = olderThan(50);
        const stillPx = Math.hypot((cam.x - b.x) * window.innerWidth, (cam.y - b.y) * window.innerHeight);
        vel = stillPx < 1.5 || captureT - a.t <= 0 ? { x: 0, y: 0 } : { x: ((cam.x - a.x) * 1000) / (captureT - a.t), y: ((cam.y - a.y) * 1000) / (captureT - a.t) };
        lastCaptureT = captureT;

        if (now - lastReport > 10000) {
          const perFrame = framesDone ? workMs / framesDone : 0;
          log(`tracking ${Math.round((framesDone * 1000) / (now - lastReport))} fps, capture delay ${delayN ? Math.round(delaySum / delayN) + ' ms' : 'unknown (assuming 45 ms)'}, work ${perFrame.toFixed(1)} ms/frame (${Math.round((workMs * 100) / (now - lastReport))}% of one core)`);
          lastReport = now;
          framesDone = 0;
          workMs = 0;
          delaySum = 0;
          delayN = 0;
        }

        // Enough new screen since the last look? Ask the app to check for nearby items (at most every 4 s).
        const dx = Math.abs(cam.x - checkedAt.x);
        const dy = Math.abs(cam.y - checkedAt.y);
        const newArea = 1 - Math.max(0, 1 - dx) * Math.max(0, 1 - dy);
        if (opts.watchMoves && window.qcBridge && newArea >= CHECK_NEW_AREA && now - lastAsk >= 4000) {
          lastAsk = now;
          checkedAt = { x: cam.x, y: cam.y };
          live.checkCam = { x: cam.x, y: cam.y }; // the next found items were spotted from here
          log(`${Math.round(newArea * 100)}% of the screen is new: asking about nearby items`);
          window.qcBridge.moved(target.filter((_, i) => visible[i]).map((p) => ({ x: p.x, y: p.y })));
        }
      }
      // Process each new frame of the screen as it arrives.
      if (typeof video.requestVideoFrameCallback === 'function') video.requestVideoFrameCallback(track);
      else setTimeout(track, 16);
    };

    // Draw every screen refresh at the tracked spot, nudged ahead along the camera's motion to make up for the
    // capture delay (none when the camera is still).
    const draw = (now) => {
      if (finished) return;
      const lead = (Math.min(80, now - lastCaptureT + 16) / 1000) * LEAD_SHARE;
      let ox = vel.x * lead;
      let oy = vel.y * lead;
      const px = Math.hypot(ox * window.innerWidth, oy * window.innerHeight);
      if (px > LEAD_CAP_PX) {
        ox *= LEAD_CAP_PX / px;
        oy *= LEAD_CAP_PX / px;
      }
      const dt = lastDraw ? Math.min(100, now - lastDraw) : 16;
      lastDraw = now;
      const moving = vel.x !== 0 || vel.y !== 0;
      const settle = 1 - Math.exp(-dt / GLIDE_MS);
      for (let i = 0; i < els.length; i++) {
        const c = calm[i];
        if (moving) {
          c.x = target[i].x;
          c.y = target[i].y;
        } else {
          const dx = target[i].x - c.x;
          const dy = target[i].y - c.y;
          const off = Math.hypot(dx * window.innerWidth, dy * window.innerHeight);
          if (off > 400) {
            c.x = target[i].x; // a big jump (a marker that was re-found elsewhere): go straight there
            c.y = target[i].y;
          } else if (off > DEAD_PX || off > 0.5 && c.gliding) {
            c.x += dx * settle;
            c.y += dy * settle;
            c.gliding = off > 0.5;
          }
        }
        shown[i].x = c.x + ox;
        shown[i].y = c.y + oy;
        // Only touch the page when a marker actually moved a pixel: an unchanged page costs the game nothing.
        const px = Math.round(shown[i].x * window.innerWidth);
        const py = Math.round(shown[i].y * window.innerHeight);
        if (els[i]._px === px && els[i]._py === py) continue;
        els[i]._px = px;
        els[i]._py = py;
        place(els[i], shown[i].x, shown[i].y);
      }
      requestAnimationFrame(draw);
    };
    track();
    requestAnimationFrame(draw);
  }

  /** Markers the player switched off (indexes into the answer's list). */
  window.qcHighlight = (index) => {
    const els = document.querySelectorAll('.m');
    els.forEach((el, i) => el.classList.toggle('hl', i === index));
    document.body.classList.toggle('focus', index >= 0 && index < els.length);
  };

  window.qcSetHidden = (list) => {
    hidden = new Set(Array.isArray(list) ? list : []);
    document.querySelectorAll('.m').forEach((el, i) => {
      if (hidden.has(i)) el.classList.add('hidden');
      else if (!live) el.classList.remove('hidden');
    });
  };

  /** Items found as the player walked: add markers that track like the others. */
  window.qcAddPoints = async (add) => {
    const { points, refImage, startIndex } = add || {};
    if (finished || !Array.isArray(points) || !points.length || !refImage) return;
    if (!live) {
      pendingAdds.push(add);
      return;
    }
    const img = await loadImage(refImage);
    const { tracker, ctx, w, h, els, target, shown, visible } = live;
    // Items from an area check start where the camera movement since that screenshot puts them.
    const since = add.fromCheck ? live.checkCam : null;
    log(`adding ${points.length} found item(s) (${points.map((p) => p.label).join(', ')}), ${since ? 'placed from camera movement' : 'searching the screen'}`);
    tracker.addMarkers(grayOf(ctx, img, w, h), points, since);
    const added = buildMarkers(points, startIndex);
    if (add.fromCheck) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = '✦ <b>Found nearby:</b> ';
      toast.append(document.createTextNode(points.map((p) => p.label).join(', ')));
      document.body.append(toast);
      setTimeout(() => toast.remove(), 4000);
    }
    added.forEach((el, j) => {
      el.classList.add('hidden');
      els.push(el);
      target.push({ x: points[j].x, y: points[j].y });
      shown.push({ x: points[j].x, y: points[j].y });
      calm.push({ x: points[j].x, y: points[j].y });
      visible.push(false);
    });
  };

  /** Precision pass: slide markers onto the exact object. */
  window.qcMovePoints = ({ moves }) => {
    if (!Array.isArray(moves) || !moves.length) return;
    log(`precision pass moved ${moves.length} marker(s)`);
    if (live) {
      live.tracker.moveMarkers(moves);
    } else {
      const els = document.querySelectorAll('.m');
      moves.forEach((mv) => {
        const el = els[mv.index];
        if (!el) return;
        el.style.transition = 'transform .35s ease-out, opacity .2s steps(3)';
        place(el, mv.x, mv.y);
        setTimeout(() => { el.style.transition = ''; }, 400);
      });
    }
  };

  /** How long markers stay (0 = until hidden or the scene changes). Restarts the clock. */
  window.qcSetLifetime = (ms) => {
    if (live && live.opts) {
      live.opts.lifetimeMs = ms;
      live.restartTimer();
    }
    log(`display time set to ${ms ? Math.round(ms / 1000) + ' s' : 'always'}`);
  };

  window.qcStart = async (opts) => {
    log(`start: ${(opts.points || []).length} marker(s), sticky=${!!opts.sticky}, watching nearby=${!!opts.watchMoves}`);
    hidden = new Set(opts.hidden || []);
    if (Array.isArray(opts.extra)) pendingAdds.push(...opts.extra);
    document.documentElement.style.setProperty('--accent', opts.accent || '#a87ffb');
    const els = buildMarkers(opts.points || []);
    els.forEach((el, i) => hidden.has(i) && el.classList.add('hidden'));
    if (opts.sticky && opts.sourceId && opts.refImage && window.QCTracker) {
      try {
        await startSticky(opts, els);
        return;
      } catch (err) {
        log('sticky tracking unavailable, showing fixed markers:', err && err.message);
        els.forEach((el) => el.classList.remove('hidden'));
      }
    }
    setTimeout(finish, opts.fixedMs || 8000);
  };
</script>
</body>
</html>
