<!doctype html>
<html lang="en" data-ui="lofi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11121a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="QuestComp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Quest Compendium</title>
    <meta name="description" content="An AI companion for PC games featuring multimodal game screen analysis, walkthroughs, achievement tracking, playthrough notes, built-in guides, and adaptive roleplay & min-max modes." />
    <meta property="og:title" content="Quest Compendium" />
    <meta property="og:description" content="An AI companion for PC games featuring multimodal game screen analysis, walkthroughs, achievement tracking, playthrough notes, built-in guides, and adaptive roleplay & min-max modes." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cinzel+Decorative:wght@700;900&family=JetBrains+Mono:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=VT323&family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved interface style and language before first paint.
      try {
        var qcSaved = JSON.parse(localStorage.getItem('quest_compendium_settings') || '{}');
        document.documentElement.setAttribute('data-ui', qcSaved.uiStyle === 'classic' ? 'classic' : 'lofi');
        var qcNav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
        var qcLang = qcSaved.language || (qcNav.indexOf('es') === 0 ? 'es' : qcNav.indexOf('pt') === 0 ? 'pt' : 'en');
        document.documentElement.lang = qcLang === 'pt' ? 'pt-BR' : qcLang === 'es' ? 'es' : 'en';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-transparent text-zinc-100 antialiased selection:bg-purple-500/30 selection:text-purple-200 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
