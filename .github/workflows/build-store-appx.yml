name: Build Microsoft Store AppX Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-appx:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets & Compile AppX
        run: npm run desktop:build:store

      - name: List Release Files
        run: dir release

      - name: Upload Store Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-compendium-store-appx
          path: release/*.appx

